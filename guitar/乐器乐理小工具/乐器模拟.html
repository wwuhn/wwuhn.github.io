<style>

  }
  .instrument-card {
    background: #f8f9fc;
    border-radius: 20px;
    max-width: 680px;
    margin: 0 auto;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .card-header {

    align-items: center;
    gap: 8px;
    padding: 24px 28px 16px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .card-header h2 {
    font-size: 28px;
    font-weight: 500;
    color: #9ca3af;
    margin: 0;
  }
  .info-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid #9ca3af;
    color: #9ca3af;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
  }
  .info-icon:hover {
    border-color: #3b66f5;
    color: #3b66f5;
  }
  .instrument-svg-container {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 32px 24px 16px;
    min-height: 380px;
    position: relative;
  }

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    padding: 16px 24px 20px;

  }

    color: #9ca3af;

    background: #d1d5db;
  }
  .status-item.playing {

  }
  .tab-bar {
    display: flex;
    background: #ffffff;
    border-radius: 16px;
    margin: 0 20px 20px;
    padding: 6px;
    gap: 4px;
  }
  .tab-item {
    flex: 1;
    padding: 14px 8px;
    border-radius: 12px;
    text-align: center;
    font-size: 26px;
    font-weight: 500;
    color: #333;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(.2,.8,.2,1);
    border: none;
    background: transparent;
  }
  .tab-item:hover {
    background: #f0f4ff;
  }
  .tab-item.active {
    background: #f0f4ff;
    color: #3b66f5;
    font-weight: 700;
  }
  /* 二胡琴弦可点击区域 */
  .string-hit {
    cursor: pointer;
    transition: all 0.15s;
  }
  .string-hit:hover {
    filter: brightness(0.9);
  }
  .string-hit:active {
    transform: scale(0.98);
  }
  /* 音孔点击效果 */
  .hole-clickable {
    cursor: pointer;
    transition: all 0.15s;
  }
  .hole-clickable:hover {
    fill: #8B4513 !important;
  }
  .hole-closed {
    fill: #5c3317 !important;
  }
  /* 钢琴键样式 */

    cursor: pointer;
    transition: all 0.1s;
  }
  .piano-key:active, .piano-key.active {
    fill: #c7d2fe !important;
  }
  /* 古筝弦点击 */
  .guzheng-string {
    cursor: pointer;
    transition: all 0.1s;
  }
  .guzheng-string:active {
    stroke: #3b66f5 !important;
    stroke-width: 3 !important;
  }
  /* 吉他弦点击 */
  .guitar-string {
    cursor: pointer;
    transition: all 0.1s;
  }

    margin: 24px auto 0;
    display: grid;
    grid-template-columns: 1fr 1fr;

    border-radius: 16px;

    flex-direction: column;
    gap: 8px;
  }
  .tool-link-card:hover {

    box-shadow: 0 6px 20px rgba(59,102,245,0.15);
  }
  .tool-link-title {
    font-size: 18px;
    font-weight: 700;
    color: #1f2937;
    display: flex;
    align-items: center;
    gap: 8px;
  }

    color: #6b7280;
    line-height: 1.5;
  }
  .tool-link-url {
    font-size: 12px;
    color: #3b66f5;
    word-break: break-all;
  }

    .status-item { font-size: 20px; }
    .tab-item { font-size: 20px; padding: 12px 4px; }
    .tools-links { grid-template-columns: 1fr; }
  }
</style>

<script>
// ====== Web Audio 初始化 ======
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// 通用音色合成函数
function playNote(freq, duration = 0.8, type = 'triangle', vol = 0.25, attack = 0.02, release = 0.3) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();

  osc.type = type;
  osc.frequency.value = freq;

  filter.type = 'lowpass';
  filter.frequency.value = freq * 3;
  filter.Q.value = 1;

  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(vol, now + attack);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration + release);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + duration + release + 0.1);
}

// 二胡音色（带揉弦效果）
function playErhu(freq, duration = 1.2) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const lfo = ctx.createOscillator();
  const lfoGain = ctx.createGain();
  const filter = ctx.createBiquadFilter();

  osc.type = 'sawtooth';
  osc.frequency.value = freq;

  lfo.frequency.value = 5;
  lfoGain.gain.value = freq * 0.015;
  lfo.connect(lfoGain);
  lfoGain.connect(osc.frequency);

  filter.type = 'lowpass';
  filter.frequency.value = freq * 2.5;
  filter.Q.value = 2;

  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.2, now + 0.05);
  gain.gain.setValueAtTime(0.2, now + duration * 0.7);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration + 0.4);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  lfo.start(now);
  osc.stop(now + duration + 0.5);
  lfo.stop(now + duration + 0.5);
}

// 葫芦丝音色
function playHulusi(freq, duration = 0.9) {
  const ctx = getAudioCtx();
  const osc1 = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();

  osc1.type = 'triangle';
  osc1.frequency.value = freq;
  osc2.type = 'sine';
  osc2.frequency.value = freq * 2;

  filter.type = 'lowpass';
  filter.frequency.value = freq * 2;
  filter.Q.value = 3;

  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.22, now + 0.08);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration + 0.2);

  osc1.connect(filter);
  osc2.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  osc1.start(now);
  osc2.start(now);
  osc1.stop(now + duration + 0.3);
  osc2.stop(now + duration + 0.3);
}

// 钢琴音色
function playPiano(freq, duration = 1.0) {
  const ctx = getAudioCtx();
  const partials = [1, 2, 3, 4];
  const gains = [0.3, 0.15, 0.05, 0.02];
  const masterGain = ctx.createGain();

  partials.forEach((mult, i) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq * mult;
    g.gain.value = gains[i];
    osc.connect(g);
    g.connect(masterGain);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  });

  const now = ctx.currentTime;
  masterGain.gain.setValueAtTime(0.3, now);
  masterGain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  masterGain.connect(ctx.destination);
}

// 古筝音色（拨弦）
function playGuzheng(freq, duration = 1.5) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();

  osc.type = 'triangle';
  osc.frequency.value = freq;

  filter.type = 'bandpass';
  filter.frequency.value = freq * 1.5;
  filter.Q.value = 1.5;

  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.3, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + duration + 0.1);
}

// 吉他音色
function playGuitar(freq, duration = 1.2) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const distortion = ctx.createWaveShaper();

  const curve = new Float32Array(256);
  for (let i = 0; i < 256; i++) {
    const x = (i - 128) / 128;
    curve[i] = (Math.PI + 50) * x / (Math.PI + 50 * Math.abs(x));
  }
  distortion.curve = curve;

  osc.type = 'sawtooth';
  osc.frequency.value = freq;

  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.25, now + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

  osc.connect(distortion);
  distortion.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + duration + 0.1);
}

// 钢琴SVG
function getPianoSVG() {
  const whiteKeyWidth = 50;
  const whiteKeyHeight = 200;
  const startX = 70;
  const notes = [
    {note: 261.63, name: '1 (Do)', idx: 0},
    {note: 293.66, name: '2 (Re)', idx: 1},
    {note: 329.63, name: '3 (Mi)', idx: 2},
    {note: 349.23, name: '4 (Fa)', idx: 3},
    {note: 392.00, name: '5 (Sol)', idx: 4},
    {note: 440.00, name: '6 (La)', idx: 5},
    {note: 493.88, name: '7 (Si)', idx: 6},
    {note: 523.25, name: 'i (Do)', idx: 7},
  ];
  let whiteKeys = '';
  notes.forEach((n, i) => {
    whiteKeys += `<rect class="piano-key" data-note="${n.note}" data-inst-type="piano" x="${startX + i*whiteKeyWidth}" y="100" width="${whiteKeyWidth-2}" height="${whiteKeyHeight}" rx="4" fill="white" stroke="#ccc" stroke-width="1"/>`;
    whiteKeys += `<text x="${startX + i*whiteKeyWidth + whiteKeyWidth/2}" y="285" text-anchor="middle" fill="#666" font-size="12">${n.name}</text>`;
  });
  // 黑键（C大调没有黑键在E-F和B-C之间）
  const blackKeyPositions = [1, 2, 4, 5, 6]; // 在第几个白键之后
  const blackFreqs = [277.18, 311.13, 369.99, 415.30, 466.16];
  let blackKeys = '';
  blackKeyPositions.forEach((pos, i) => {
    const bx = startX + pos*whiteKeyWidth - 15;
    blackKeys += `<rect class="piano-key" data-note="${blackFreqs[i]}" data-inst-type="piano" x="${bx}" y="100" width="30" height="120" rx="3" fill="#222"/>`;
  });

  return `
  <svg viewBox="0 0 540 320" width="500" height="300" xmlns="http://www.w3.org/2000/svg">
    <rect x="60" y="90" width="420" height="225" rx="8" fill="#3D2314"/>
    ${whiteKeys}
    ${blackKeys}
    <text x="270" y="70" text-anchor="middle" fill="#6b7280" font-size="14">C大调中央C起一个八度</text>
  </svg>
  `;
}

// 古筝SVG
function getGuzhengSVG() {
  let strings = '';
  const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
  const stringLabels = ['1','2','3','5','6','i','2','3'];
  // 古筝是弧形琴身，琴弦呈扇形
  for (let i = 0; i < 8; i++) {
    const x1 = 120 + i*8;
    const x2 = 380 + i*18;
    const y = 60 + i*32;
    strings += `<line class="guzheng-string" data-note="${notes[i]}" data-inst-type="guzheng" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#B8860B" stroke-width="2.5" stroke-linecap="round"/>`;
    // 琴码
    strings += `<polygon points="${(x1+x2)/2-6},${y-8} ${(x1+x2)/2+6},${y-8} ${(x1+x2)/2},${y+8}" fill="#8B4513"/>`;
    strings += `<text x="${x1-15}" y="${y+4}" fill="#9ca3af" font-size="11">${stringLabels[i]}</text>`;
  }

  return `
  <svg viewBox="0 0 520 340" width="460" height="300" xmlns="http://www.w3.org/2000/svg">
    <!-- 古筝琴身 -->
    <path d="M100 40 Q 90 170 110 300 L 420 290 Q 430 165 410 30 Z" fill="url(#guzhengWood)" stroke="#5C3317" stroke-width="2"/>
    <defs>
      <linearGradient id="guzhengWood" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#8B5A2B"/>
        <stop offset="50%" stop-color="#D4A76A"/>
        <stop offset="100%" stop-color="#8B5A2B"/>
      </linearGradient>
    </defs>
    <!-- 前岳山后岳山 -->
    <rect x="110" y="40" width="12" height="260" rx="3" fill="#5C3317"/>
    <rect x="400" y="30" width="12" height="270" rx="3" fill="#5C3317"/>
    ${strings}
    <text x="260" y="330" text-anchor="middle" fill="#9ca3af" font-size="12">点击琴弦拨弦演奏（五声音阶）</text>
  </svg>
  `;
}

// 吉他SVG
function getGuitarSVG() {
  let strings = '';
  const guitarFreqs = [329.63, 246.94, 196.00, 146.83, 110.00, 82.41]; // 1弦到6弦（高到低）
  for (let i = 0; i < 6; i++) {
    const x = 160 + i*18;
    strings += `<line class="guitar-string" data-note="${guitarFreqs[i]}" data-inst-type="guitar" x1="${x}" y1="40" x2="${x}" y2="440" stroke="${i<3?'#C0C0C0':'#DAA520'}" stroke-width="${1.5+i*0.3}"/>`;
  }
  // 品丝
  let frets = '';
  for (let i = 1; i <= 8; i++) {
    const y = 110 + i*35;
    frets += `<line x1="152" y1="${y}" x2="256" y2="${y}" stroke="#888" stroke-width="1.5"/>`;
  }

  return `
  <svg viewBox="0 0 420 500" width="260" height="420" xmlns="http://www.w3.org/2000/svg">
    <!-- 琴头 -->
    <rect x="148" y="20" width="112" height="60" rx="10" fill="#5C3317"/>
    <!-- 琴钮 -->
    <circle cx="140" cy="35" r="8" fill="#C0C0C0"/>
    <circle cx="140" cy="55" r="8" fill="#C0C0C0"/>
    <circle cx="268" cy="35" r="8" fill="#C0C0C0"/>
    <circle cx="268" cy="55" r="8" fill="#C0C0C0"/>
    <circle cx="154" cy="70" r="8" fill="#C0C0C0"/>
    <circle cx="254" cy="70" r="8" fill="#C0C0C0"/>
    <!-- 琴颈 -->
    <rect x="152" y="80" width="104" height="300" fill="#8B5A2B"/>
    <!-- 指板 -->
    <rect x="156" y="80" width="96" height="300" fill="#3D2314"/>
    ${frets}
    <!-- 品位标记 -->
    <circle cx="204" cy="215" r="5" fill="#FFF" opacity="0.6"/>
    <circle cx="204" cy="355" r="5" fill="#FFF" opacity="0.6"/>
    <!-- 琴身 -->
    <ellipse cx="204" cy="420" rx="90" ry="70" fill="url(#guitarBody)"/>
    <defs>
      <radialGradient id="guitarBody" cx="40%" cy="35%">
        <stop offset="0%" stop-color="#D4A76A"/>
        <stop offset="100%" stop-color="#8B4513"/>
      </radialGradient>
    </defs>
    <!-- 音孔 -->
    <circle cx="204" cy="420" r="30" fill="#2a1a0a"/>
    <circle cx="204" cy="420" r="35" fill="none" stroke="#FFD700" stroke-width="2"/>
    <!-- 下码 -->
    <rect x="170" y="460" width="68" height="10" rx="2" fill="#3D2314"/>
    ${strings}
    <text x="204" y="495" text-anchor="middle" fill="#9ca3af" font-size="11">点击琴弦拨弦</text>
  </svg>
  `;
}

// ====== 乐器配置 ======
const instrumentConfig = {
  erhu: {
    svg: getErhuSVG,
    origin: '唐朝起源',
    hint: '点按琴弦演奏',
    keyboardMap: [293.66, 329.63, 369.99, 392.00, 440.00, 493.88, 587.33, 659.25],
    playFn: playErhu
  },
  hulusi: {
    svg: getHulusiSVG,
    origin: '云南傣族',
    hint: '点按音孔演奏',
    keyboardMap: [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50],
    playFn: playHulusi
  },
  piano: {
    svg: getPianoSVG,
    origin: '键盘乐器',
    hint: '点击琴键演奏',
    keyboardMap: [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25],
    playFn: playPiano
  },
  guzheng: {
    svg: getGuzhengSVG,
    origin: '战国起源',
    hint: '点击琴弦演奏',
    keyboardMap: [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25],
    playFn: playGuzheng
  },
  guitar: {
    svg: getGuitarSVG,
    origin: '西洋弹拨',
    hint: '点击琴弦演奏',
    keyboardMap: [329.63, 246.94, 196.00, 146.83, 110.00, 82.41, 164.81, 220.00],
    playFn: playGuitar
  }
};

let currentInst = 'erhu';

// 渲染乐器
function renderInstrument(name) {
  const config = instrumentConfig[name];
  const container = document.getElementById('svgContainer');
  container.innerHTML = config.svg();
  document.getElementById('originText').textContent = config.origin;
  document.getElementById('playHint').textContent = config.hint;
  document.getElementById('statusText').textContent = '等待演奏';
  document.getElementById('statusText').classList.remove('playing');
  bindInstrumentEvents(name);
}

// 绑定点击事件
function bindInstrumentEvents(name) {
  const config = instrumentConfig[name];
  // 所有可点击元素
  const clickables = document.querySelectorAll('[data-inst-type="' + name + '"]');
  clickables.forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const freq = parseFloat(el.getAttribute('data-note'));
      if (freq) {
        config.playFn(freq, 1.0);
        document.getElementById('statusText').textContent = '正在演奏 ♪';
        document.getElementById('statusText').classList.add('playing');
        // 添加振动动画
        el.classList.add('vibrating');
        setTimeout(() => el.classList.remove('vibrating'), 400);
        clearTimeout(window._statusTimer);
        window._statusTimer = setTimeout(() => {
          document.getElementById('statusText').textContent = '等待演奏';
          document.getElementById('statusText').classList.remove('playing');
        }, 1200);
      }
    });
  });
}

// Tab切换
document.getElementById('tabBar').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab-item');
  if (!tab) return;
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentInst = tab.getAttribute('data-inst');
  renderInstrument(currentInst);
});

// 键盘快捷键
document.addEventListener('keydown', (e) => {
  const key = e.key;
  if (key >= '1' && key <= '8') {
    const idx = parseInt(key) - 1;
    const config = instrumentConfig[currentInst];
    if (config.keyboardMap[idx]) {
      config.playFn(config.keyboardMap[idx], 0.8);
      document.getElementById('statusText').textContent = '正在演奏 ♪';
      document.getElementById('statusText').classList.add('playing');
      clearTimeout(window._statusTimer);
      window._statusTimer = setTimeout(() => {
        document.getElementById('statusText').textContent = '等待演奏';
        document.getElementById('statusText').classList.remove('playing');
      }, 1000);
    }
  }
});

// 信息按钮
document.getElementById('infoBtn').addEventListener('click', () => {
  alert('🎵 小工具·乐器模拟\n\n五种民族/常用乐器：二胡、葫芦丝、钢琴、古筝、吉他\n\n• 直接点击乐器上的音位/音孔/琴弦/琴键即可发声\n• 支持键盘数字键 1-8 快捷演奏\n• 所有音色由 Web Audio API 实时合成\n• 下方卡片提供乐理速查表和五度圈在线工具入口');
});

// 初始化
renderInstrument('erhu');
</script>
