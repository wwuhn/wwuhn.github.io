<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国民族乐器模拟实验室</title>
    <script src="https://aisearch-task.bj.bcebos.com/static/tailwindcss-3.4.17.js"></script>
    <style>
        :root {
            --brand-rgb: 194, 65, 12;
            --brand-color: rgb(var(--brand-rgb));
            --card-bg: rgba(255, 255, 255, 0.92);
            --wood-brown: #8B4513;
            --wood-light: #D2B48C;
            --wood-dark: #654321;
        }
        
        body {
            font-family: 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 25%, #fcd34d 50%, #fbbf24 75%, #f59e0b 100%);
            min-height: 100vh;
            background-attachment: fixed;
        }
        
        .wood-texture {
            background: linear-gradient(90deg, 
                #8B4513 0%, #A0522D 10%, #8B4513 20%, #CD853F 30%, 
                #8B4513 40%, #A0522D 50%, #8B4513 60%, #CD853F 70%, 
                #8B4513 80%, #A0522D 90%, #8B4513 100%);
        }
        
        .erhu-string {
            position: absolute;
            width: 2px;
            background: linear-gradient(90deg, #C0C0C0, #E8E8E8, #C0C0C0);
            transform-origin: top center;
        }
        
        .erhu-finger-mark {
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .erhu-finger-mark:hover, .erhu-finger-mark.active {
            fill: #dc2626;
            r: 10;
        }
        
        .suona-hole {
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .suona-hole.closed {
            fill: #1f2937;
        }
        .suona-hole.open {
            fill: #fbbf24;
            stroke: #92400e;
            stroke-width: 2;
        }
        
        .piano-key-white {
            cursor: pointer;
            transition: all 0.08s ease;
            fill: white;
            stroke: #374151;
            stroke-width: 1;
        }
        .piano-key-white:active, .piano-key-white.active {
            fill: #fde68a;
        }
        .piano-key-black {
            cursor: pointer;
            transition: all 0.08s ease;
            fill: #1f2937;
        }
        .piano-key-black:active, .piano-key-black.active {
            fill: #92400e;
        }
        
        .guzheng-string {
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .guzheng-string:active, .guzheng-string.active {
            stroke: #dc2626;
            stroke-width: 3;
        }
        
        .hulusi-pipe {
            fill: linear-gradient(180deg, #D2B48C, #8B4513);
        }
        
        .tab-btn {
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: var(--brand-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(194, 65, 12, 0.4);
        }
        
        .note-btn {
            transition: all 0.15s cubic-bezier(.2,.8,.2,1);
        }
        .note-btn.playing {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(194, 65, 12, 0.4);
            background: linear-gradient(to bottom, #fbbf24, #f59e0b) !important;
            color: #7c2d12 !important;
        }
        
        @keyframes pluck {
            0% { transform: scaleY(1); }
            50% { transform: scaleY(1.05); }
            100% { transform: scaleY(1); }
        }
        .pluck-anim {
            animation: pluck 0.15s ease-out;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0.95; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .instrument-panel {
            animation: fadeInUp 0.4s cubic-bezier(.2,.8,.2,1);
        }
        
        .info-card {
            backdrop-filter: blur(12px);
            background: rgba(255,255,255,0.85);
            border: 1px solid rgba(255,255,255,0.5);
        }
    </style>
</head>
<body class="pb-16">
    <!-- 顶部标题区 -->
    <header class="pt-8 pb-6 px-4 text-center">
        <h1 class="text-4xl md:text-5xl font-black text-amber-900 mb-2 tracking-tight" style="font-family: 'Songti SC', 'STSong', serif;">
            🎵 中国民族乐器模拟实验室
        </h1>
        <p class="text-lg text-amber-800/80 max-w-2xl mx-auto">
            点击乐器即可演奏，体验六种民族乐器的独特音色
        </p>
    </header>

    <!-- 乐器切换标签栏 -->
    <div class="max-w-5xl mx-auto px-4 mb-6">
        <div class="flex flex-wrap justify-center gap-2 md:gap-3" id="instrumentTabs">
            <button class="tab-btn active px-4 py-2 md:px-6 md:py-3 rounded-full font-semibold text-sm md:text-base bg-white/70 text-amber-900 shadow-md" data-instrument="erhu">
                🎻 二胡
            </button>
            <button class="tab-btn px-4 py-2 md:px-6 md:py-3 rounded-full font-semibold text-sm md:text-base bg-white/70 text-amber-900 shadow-md" data-instrument="suona">
                🎷 唢呐
            </button>
            <button class="tab-btn px-4 py-2 md:px-6 md:py-3 rounded-full font-semibold text-sm md:text-base bg-white/70 text-amber-900 shadow-md" data-instrument="hulusi">
                🎶 葫芦丝
            </button>
            <button class="tab-btn px-4 py-2 md:px-6 md:py-3 rounded-full font-semibold text-sm md:text-base bg-white/70 text-amber-900 shadow-md" data-instrument="guzheng">
                🎼 古筝
            </button>
            <button class="tab-btn px-4 py-2 md:px-6 md:py-3 rounded-full font-semibold text-sm md:text-base bg-white/70 text-amber-900 shadow-md" data-instrument="pipa">
                🪕 琵琶
            </button>
            <button class="tab-btn px-4 py-2 md:px-6 md:py-3 rounded-full font-semibold text-sm md:text-base bg-white/70 text-amber-900 shadow-md" data-instrument="dizi">
                🎵 竹笛
            </button>
        </div>
    </div>

    <!-- 主内容区 -->
    <main class="max-w-5xl mx-auto px-4">
        <!-- 状态显示栏 -->
        <div class="info-card rounded-2xl p-4 mb-6 shadow-lg">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse" id="statusIndicator"></div>
                    <span class="font-semibold text-amber-900" id="statusText">当前乐器：二胡 | 模式：点击演奏</span>
                </div>
                <div class="text-sm text-amber-700/70">支持键盘快捷键 1-8</div>
            </div>
        </div>

        <!-- 乐器可视化区域 -->
        <div class="info-card rounded-3xl p-6 md:p-8 shadow-xl mb-6">
            <div id="instrumentContainer" class="flex justify-center items-center min-h-[300px] md:min-h-[400px]">
                <!-- 乐器SVG将在这里动态渲染 -->
            </div>
        </div>

        <!-- 演奏键盘区域 -->
        <div class="info-card rounded-2xl p-4 md:p-6 shadow-lg mb-6">
            <h3 class="text-lg font-bold text-amber-900 mb-4 text-center">🎹 演奏键盘</h3>
            <div class="flex flex-wrap justify-center gap-2 md:gap-3" id="noteKeyboard">
                <!-- 音符按钮将动态生成 -->
            </div>
        </div>

        <!-- 经典曲目演示 -->
        <div class="info-card rounded-2xl p-4 md:p-6 shadow-lg mb-6">
            <h3 class="text-lg font-bold text-amber-900 mb-4 text-center">🎶 经典曲目演示</h3>
            <div class="flex flex-wrap justify-center gap-3" id="demoSongs">
                <!-- 曲目按钮将动态生成 -->
            </div>
        </div>

        <!-- 乐器介绍卡片 -->
        <div class="grid md:grid-cols-2 gap-6">
            <div class="info-card rounded-2xl p-5 shadow-lg">
                <h3 class="text-lg font-bold text-amber-900 mb-3 flex items-center gap-2">
                    <span>📜</span> 乐器介绍
                </h3>
                <div class="text-[15px] text-gray-700 leading-relaxed space-y-2" id="instrumentInfo">
                    <!-- 介绍内容动态生成 -->
                </div>
            </div>
            <div class="info-card rounded-2xl p-5 shadow-lg">
                <h3 class="text-lg font-bold text-amber-900 mb-3 flex items-center gap-2">
                    <span>💡</span> 演奏小知识
                </h3>
                <div class="text-[15px] text-gray-700 leading-relaxed space-y-2" id="instrumentTips">
                    <!-- 技巧内容动态生成 -->
                </div>
            </div>
        </div>
    </main>

    <script>
        // ========== 音频引擎 ==========
        let audioCtx = null;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        // 音符频率映射（D调基准）
        const noteFrequencies = {
            'do_low': 293.66,   // D
            're_low': 329.63,   // E
            'mi_low': 369.99,   // F#
            'fa_low': 392.00,   // G
            'sol': 392.00,      // G (sol)
            'la': 440.00,       // A (la)
            'do': 523.25,       // C
            're': 587.33,       // D
            'mi': 659.25,       // E
            'fa': 698.46,       // F
            'sol_high': 783.99, // G
            'la_high': 880.00,  // A
            'si': 493.88        // B
        };

        // 不同乐器的音色合成
        function playNote(freq, instrument = 'erhu', duration = 0.8) {
            const ctx = initAudio();
            if (ctx.state === 'suspended') ctx.resume();
            
            const masterGain = ctx.createGain();
            masterGain.connect(ctx.destination);
            masterGain.gain.setValueAtTime(0, ctx.currentTime);
            
            let oscillators = [];
            let harmonicGains = [];
            
            switch(instrument) {
                case 'erhu':
                    // 二胡音色：锯齿波+谐波，模拟擦弦质感
                    const o1 = ctx.createOscillator();
                    o1.type = 'sawtooth';
                    o1.frequency.value = freq;
                    const g1 = ctx.createGain();
                    g1.gain.value = 0.3;
                    o1.connect(g1).connect(masterGain);
                    oscillators.push(o1);
                    harmonicGains.push(g1);
                    
                    // 2次谐波
                    const o2 = ctx.createOscillator();
                    o2.type = 'sawtooth';
                    o2.frequency.value = freq * 2;
                    const g2 = ctx.createGain();
                    g2.gain.value = 0.15;
                    o2.connect(g2).connect(masterGain);
                    oscillators.push(o2);
                    harmonicGains.push(g2);
                    
                    // 低通滤波模拟柔和感
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 2000;
                    filter.Q.value = 1;
                    masterGain.disconnect();
                    masterGain.connect(filter).connect(ctx.destination);
                    
                    masterGain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + 0.05);
                    masterGain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + duration * 0.7);
                    masterGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    break;
                    
                case 'suona':
                    // 唢呐音色：方波+高频，明亮尖锐
                    const so1 = ctx.createOscillator();
                    so1.type = 'square';
                    so1.frequency.value = freq;
                    const sg1 = ctx.createGain();
                    sg1.gain.value = 0.25;
                    so1.connect(sg1).connect(masterGain);
                    oscillators.push(so1);
                    
                    const so2 = ctx.createOscillator();
                    so2.type = 'sawtooth';
                    so2.frequency.value = freq * 3;
                    const sg2 = ctx.createGain();
                    sg2.gain.value = 0.1;
                    so2.connect(sg2).connect(masterGain);
                    oscillators.push(so2);
                    
                    const suonaFilter = ctx.createBiquadFilter();
                    suonaFilter.type = 'bandpass';
                    suonaFilter.frequency.value = freq * 2;
                    suonaFilter.Q.value = 0.8;
                    masterGain.disconnect();
                    masterGain.connect(suonaFilter).connect(ctx.destination);
                    
                    masterGain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.02);
                    masterGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    break;
                    
                case 'hulusi':
                    // 葫芦丝音色：正弦波+少量谐波，空灵柔和
                    const ho1 = ctx.createOscillator();
                    ho1.type = 'sine';
                    ho1.frequency.value = freq;
                    const hg1 = ctx.createGain();
                    hg1.gain.value = 0.35;
                    ho1.connect(hg1).connect(masterGain);
                    oscillators.push(ho1);
                    
                    const ho2 = ctx.createOscillator();
                    ho2.type = 'triangle';
                    ho2.frequency.value = freq * 2;
                    const hg2 = ctx.createGain();
                    hg2.gain.value = 0.08;
                    ho2.connect(hg2).connect(masterGain);
                    oscillators.push(ho2);
                    
                    masterGain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.08);
                    masterGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    break;
                    
                case 'guzheng':
                    // 古筝音色：拨弦指数衰减
                    const zo1 = ctx.createOscillator();
                    zo1.type = 'triangle';
                    zo1.frequency.value = freq;
                    const zg1 = ctx.createGain();
                    zg1.gain.value = 0.4;
                    zo1.connect(zg1).connect(masterGain);
                    oscillators.push(zo1);
                    
                    // 拨弦噪声瞬态
                    const noise = ctx.createBufferSource();
                    const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
                    const noiseData = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < noiseData.length; i++) {
                        noiseData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (noiseData.length * 0.3));
                    }
                    noise.buffer = noiseBuffer;
                    const noiseGain = ctx.createGain();
                    noiseGain.gain.value = 0.1;
                    noise.connect(noiseGain).connect(masterGain);
                    noise.start();
                    
                    masterGain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + 0.01);
                    masterGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    break;
                    
                case 'pipa':
                    // 琵琶音色：更清脆的拨弦
                    const po1 = ctx.createOscillator();
                    po1.type = 'sawtooth';
                    po1.frequency.value = freq;
                    const pg1 = ctx.createGain();
                    pg1.gain.value = 0.3;
                    po1.connect(pg1).connect(masterGain);
                    oscillators.push(po1);
                    
                    const po2 = ctx.createOscillator();
                    po2.type = 'triangle';
                    po2.frequency.value = freq * 4;
                    const pg2 = ctx.createGain();
                    pg2.gain.value = 0.05;
                    po2.connect(pg2).connect(masterGain);
                    oscillators.push(po2);
                    
                    masterGain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.005);
                    masterGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration * 0.6);
                    break;
                    
                case 'dizi':
                    // 竹笛音色：正弦波+气声，明亮通透
                    const dio1 = ctx.createOscillator();
                    dio1.type = 'sine';
                    dio1.frequency.value = freq;
                    const dig1 = ctx.createGain();
                    dig1.gain.value = 0.3;
                    dio1.connect(dig1).connect(masterGain);
                    oscillators.push(dio1);
                    
                    const dio2 = ctx.createOscillator();
                    dio2.type = 'sine';
                    dio2.frequency.value = freq * 2;
                    const dig2 = ctx.createGain();
                    dig2.gain.value = 0.12;
                    dio2.connect(dig2).connect(masterGain);
                    oscillators.push(dio2);
                    
                    masterGain.gain.linearRampToValueAtTime(0.28, ctx.currentTime + 0.03);
                    masterGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    break;
            }
            
            oscillators.forEach(o => {
                o.start(ctx.currentTime);
                o.stop(ctx.currentTime + duration + 0.1);
            });
        }

        // 播放旋律序列
        async function playMelody(notes, instrument, tempo = 0.4) {
            updateStatus('正在演奏...', 'playing');
            for (const [noteName, dur] of notes) {
                const freq = noteFrequencies[noteName];
                if (freq) {
                    playNote(freq, instrument, dur * tempo * 1.5);
                    highlightNote(noteName);
                    await new Promise(r => setTimeout(r, dur * tempo * 1000));
                }
            }
            updateStatus(`当前乐器：${instrumentData[currentInstrument].name} | 模式：点击演奏`, 'ready');
        }

        function highlightNote(noteName) {
            document.querySelectorAll('.note-btn').forEach(btn => {
                btn.classList.remove('playing');
                if (btn.dataset.note === noteName) {
                    btn.classList.add('playing');
                    setTimeout(() => btn.classList.remove('playing'), 200);
                }
            });
        }

        function updateStatus(text, state) {
            document.getElementById('statusText').textContent = text;
            const indicator = document.getElementById('statusIndicator');
            indicator.className = 'w-3 h-3 rounded-full animate-pulse';
            indicator.classList.add(state === 'playing' ? 'bg-red-500' : 'bg-green-500');
        }

        // ========== 乐器数据配置 ==========
        const instrumentData = {
            erhu: {
                name: '二胡',
                notes: [
                    { key: '1', note: 'do_low', label: '内弦空弦 D' },
                    { key: '2', note: 're_low', label: '内弦2指 E' },
                    { key: '3', note: 'mi_low', label: '内弦3指 F#' },
                    { key: '4', note: 'fa_low', label: '内弦4指 G' },
                    { key: '5', note: 'sol', label: '外弦空弦 A' },
                    { key: '6', note: 'la', label: '外弦2指 B' },
                    { key: '7', note: 'do', label: '外弦3指 D' },
                    { key: '8', note: 're', label: '外弦4指 E' }
                ],
                songs: [
                    { name: '二泉映月', notes: [['sol',1],['mi_low',1],['sol',2],['re_low',1],['mi_low',1],['sol',2],['la',1],['sol',1],['mi_low',2],['re_low',2]], tempo: 0.6 },
                    { name: '良宵', notes: [['do',0.5],['re',0.5],['mi',0.5],['sol',1],['la',0.5],['sol',0.5],['mi',1],['re',0.5],['do',0.5],['la',1]], tempo: 0.4 },
                    { name: '赛马', notes: [['mi_low',0.25],['sol',0.25],['mi_low',0.25],['sol',0.25],['la',0.25],['sol',0.25],['mi_low',0.25],['re_low',0.25],['mi_low',0.5],['sol',0.5]], tempo: 0.25 }
                ],
                info: [
                    '起源于唐朝，前身名为"奚琴"，至今已有一千多年历史',
                    '核心构造：琴杆、六角琴筒、两根钢丝缠弦、马尾琴弓、蟒皮共鸣面',
                    '定音标准：内弦定D音，外弦定A音，是中国民族管弦乐中最具歌唱性的拉弦乐器',
                    '音色特点：接近人声，既能演奏柔美抒情的旋律，也能表现气势磅礴的激昂段落'
                ],
                tips: [
                    '二胡没有品丝，音准完全依靠手指按弦位置控制，新手建议先从空弦音阶开始练习',
                    '正确手型要保持掌心虚空，像握着一颗鸡蛋，手指自然弯曲用指腹前端触弦',
                    '《二泉映月》是阿炳的代表作，被国际乐坛誉为"中国的命运交响曲"'
                ]
            },
            suona: {
                name: '唢呐',
                notes: [
                    { key: '1', note: 'sol', label: '筒音 Sol (5)' },
                    { key: '2', note: 'la', label: '6孔 La (6)' },
                    { key: '3', note: 'si', label: '5孔 Si (7)' },
                    { key: '4', note: 'do', label: '4孔 Do (1)' },
                    { key: '5', note: 're', label: '3孔 Re (2)' },
                    { key: '6', note: 'mi', label: '2孔 Mi (3)' },
                    { key: '7', note: 'fa', label: '1孔 Fa (4)' },
                    { key: '8', note: 'sol_high', label: '高八度 Sol' }
                ],
                songs: [
                    { name: '百鸟朝凤', notes: [['sol',0.3],['la',0.3],['do',0.6],['re',0.3],['mi',0.3],['sol_high',0.6],['mi',0.3],['re',0.3],['do',0.6],['la',0.3],['sol',0.6]], tempo: 0.4 },
                    { name: '二八调开门', notes: [['la',0.5],['sol',0.5],['mi',0.5],['sol',0.5],['la',0.5],['do',0.5],['la',1],['sol',0.5],['mi',0.5],['sol',1]], tempo: 0.5 },
                    { name: '喇叭调', notes: [['sol',0.5],['do',0.5],['re',0.5],['sol',0.5],['mi',0.5],['re',0.5],['do',0.5],['la',0.5],['sol',1]], tempo: 0.4 }
                ],
                info: [
                    '名称来自古代波斯语Surnā（祖尔纳）的音译，金元时期经丝绸之路传入中原',
                    '民间俗称"喇叭"，是中国各地广泛流传的双簧气鸣乐器',
                    '音色高亢明亮，穿透力极强，是民间婚丧嫁娶、节庆吹打班的核心乐器',
                    '传统唢呐为8孔，常用指法有筒音作sol、筒音作la等'
                ],
                tips: [
                    '"唢呐一响，全剧终"——唢呐音量大、音色突出，在民族乐队中常担任领奏',
                    '筒音作sol是最常用的入门指法，适合演奏大多数民间小曲和流行曲调',
                    '唢呐的循环换气法可以让乐手连续演奏几分钟而不中断，是核心技巧之一'
                ]
            },

        // ========== 键盘与UI渲染 ==========
        function renderKeyboard(type) {
            const keyboard = document.getElementById('noteKeyboard');
            const data = instrumentData[type];
            keyboard.innerHTML = '';
            
            data.notes.forEach(n => {
                const btn = document.createElement('button');
                btn.className = 'note-btn px-4 py-3 md:px-6 md:py-4 bg-gradient-to-b from-amber-100 to-amber-200 hover:from-amber-200 hover:to-amber-300 rounded-xl shadow-md border border-amber-300/50 font-semibold text-amber-900 text-sm md:text-base min-w-[80px]';
                btn.dataset.note = n.note;
                btn.dataset.key = n.key;
                btn.innerHTML = `<div class="text-xs text-amber-600/70 mb-1">键${n.key}</div>${n.label}`;
                
                btn.addEventListener('click', () => {
                    playNote(noteFrequencies[n.note], type);
                    btn.classList.add('playing');
                    const originalHTML = btn.innerHTML;
                    btn.innerHTML = btn.innerHTML + ' <span class="playing-indicator ml-1">♪ 演奏中</span>';
                    setTimeout(() => {
                        btn.classList.remove('playing');
                        const indicator = btn.querySelector('.playing-indicator');
                        if (indicator) indicator.remove();
                    }, 800);
                });
                
                keyboard.appendChild(btn);
            });
        }

        function renderSongs(type) {
            const songsContainer = document.getElementById('demoSongs');
            const data = instrumentData[type];
            songsContainer.innerHTML = '';
            
            data.songs.forEach(song => {
                const btn = document.createElement('button');
                btn.className = 'note-btn px-5 py-3 bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white rounded-full shadow-lg font-semibold text-sm md:text-base';
                btn.textContent = '▶ ' + song.name;
                
                btn.addEventListener('click', () => {
                    // 立即显示反馈
                    btn.textContent = '♫ 演奏中...';
                    btn.disabled = true;
                    btn.classList.add('opacity-70', 'scale-95');
                    
                    const totalDuration = Math.max(song.notes.reduce((sum, n) => sum + n[1] * song.tempo * 1000, 0), 1000);
                    setTimeout(() => {
                        btn.textContent = '▶ ' + song.name;
                        btn.disabled = false;
                        btn.classList.remove('opacity-70', 'scale-95');
                    }, totalDuration + 500);
                    playMelody(song.notes, type, song.tempo);
                });
                
                songsContainer.appendChild(btn);
            });
        }

        function renderInfo(type) {
            const data = instrumentData[type];
            document.getElementById('instrumentInfo').innerHTML = data.info.map(t => `<p>• ${t}</p>`).join('');
            document.getElementById('instrumentTips').innerHTML = data.tips.map(t => `<p>• ${t}</p>`).join('');
        }

        // ========== 乐器切换 ==========
        function switchInstrument(type) {
            currentInstrument = type;
            
            // 更新标签状态
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.instrument === type) btn.classList.add('active');
            });
            
            // 更新容器动画类
            const container = document.getElementById('instrumentContainer');
            container.classList.remove('instrument-panel');
            void container.offsetWidth; // 触发重绘
            container.classList.add('instrument-panel');
            
            // 重新渲染所有内容
            renderInstrument(type);
            renderKeyboard(type);
            renderSongs(type);
            renderInfo(type);
            updateStatus(`当前乐器：${instrumentData[type].name} | 模式：点击演奏`, 'ready');
        }

        // ========== 键盘快捷键 ==========
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key >= '1' && key <= '8') {
                const note = instrumentData[currentInstrument].notes.find(n => n.key === key);
                if (note) {
                    playNote(noteFrequencies[note.note], currentInstrument);
                    highlightNote(note.note);
                    
                    document.querySelectorAll('.note-btn').forEach(btn => {
                        if (btn.dataset.key === key) {
                            btn.classList.add('playing');
                            setTimeout(() => btn.classList.remove('playing'), 200);
                        }
                    });
                }
            }
        });

        // ========== 初始化 ==========
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => switchInstrument(btn.dataset.instrument));
        });

        // 首次渲染
        switchInstrument('erhu');
        
        // 确保音频在用户交互后启动
        document.addEventListener('click', () => initAudio(), { once: true });
    </script>
