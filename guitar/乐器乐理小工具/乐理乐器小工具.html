<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小工具·乐器模拟</title>
<script src="https://aisearch-task.bj.bcebos.com/static/tailwindcss-3.4.17.js"></script>
<style>
  body {
    font-family: 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e8edf5 50%, #f0f4f8 100%);
    min-height: 100vh;
    padding: 24px 16px;
    margin: 0;
  }
  .instrument-card {
    background: #f8f9fc;
    border-radius: 20px;
    max-width: 680px;
    margin: 0 auto;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 24px 28px 16px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .card-header h2 {
    font-size: 28px;
    font-weight: 500;
    color: #9ca3af;
    margin: 0;
  }
  .header-tools {
    margin-left: auto;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .header-tool-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid #9ca3af;
    background: transparent;
    color: #9ca3af;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    padding: 0;
  }
  .header-tool-btn:hover {
    border-color: #3b66f5;
    color: #3b66f5;
  }
  .header-tool-btn.active {
    border-color: #3b66f5;
    color: #3b66f5;
    background: #f0f4ff;
  }
  .info-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid #9ca3af;
    color: #9ca3af;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
  }
  .info-icon:hover {
    border-color: #3b66f5;
    color: #3b66f5;
  }
  .instrument-svg-container {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 32px 24px 16px;
    min-height: 380px;
    position: relative;
  }
  .status-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    padding: 16px 24px 20px;
    flex-wrap: wrap;
  }
  .status-item {
    font-size: 28px;
    font-weight: 500;
    color: #9ca3af;
  }
  .status-divider {
    width: 2px;
    height: 28px;
    background: #d1d5db;
  }
  .status-item.playing {
    color: #3b66f5;
  }
  .tab-bar {
    display: flex;
    background: #ffffff;
    border-radius: 16px;
    margin: 0 20px 20px;
    padding: 6px;
    gap: 4px;
    flex-wrap: wrap;
  }
  .tab-item {
    flex: 1;
    min-width: 80px;
    padding: 14px 8px;
    border-radius: 12px;
    text-align: center;
    font-size: 24px;
    font-weight: 500;
    color: #333;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(.2,.8,.2,1);
    border: none;
    background: transparent;
  }
  .tab-item:hover {
    background: #f0f4ff;
  }
  .tab-item.active {
    background: #f0f4ff;
    color: #3b66f5;
    font-weight: 700;
  }
  /* 二胡琴弦可点击区域 */
  .string-hit {
    cursor: pointer;
    transition: all 0.15s;
  }
  .string-hit:hover {
    filter: brightness(0.9);
  }
  .string-hit:active {
    transform: scale(0.98);
  }
  /* 音孔点击效果 */
  .hole-clickable {
    cursor: pointer;
    transition: all 0.15s;
  }
  .hole-clickable:hover {
    fill: #8B4513 !important;
  }
  .hole-closed {
    fill: #5c3317 !important;
  }
  /* 钢琴键样式 */
  .piano-key {
    cursor: pointer;
    transition: all 0.1s;
  }
  .piano-key:active, .piano-key.active {
    fill: #c7d2fe !important;
  }
  /* 古筝弦点击 */
  .guzheng-string {
    cursor: pointer;
    transition: all 0.1s;
  }
  .guzheng-string:active {
    stroke: #3b66f5 !important;
    stroke-width: 3 !important;
  }
  /* 吉他弦点击 */
  .guitar-string {
    cursor: pointer;
    transition: all 0.1s;
  }
  /* 五线谱相关样式 */
  .staff-note {
    cursor: pointer;
    transition: all 0.15s;
  }
  .staff-note:hover {
    fill: #6385f7 !important;
  }
  .staff-clef-tab {
    cursor: pointer;
    transition: all 0.2s;
  }
  .staff-clef-tab:hover {
    background: #f0f4ff;
  }
  .staff-clef-tab.active {
    background: #f0f4ff;
    color: #3b66f5;
    font-weight: 700;
  }
  .staff-line-hit {
    cursor: pointer;
    fill: transparent;
  }
  /* 工具链接区 */
  .tools-links {
    max-width: 680px;
    margin: 24px auto 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .tool-link-card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    text-decoration: none;
    color: inherit;
    transition: all 0.25s;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tool-link-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(59,102,245,0.15);
  }
  .tool-link-title {
    font-size: 18px;
    font-weight: 700;
    color: #1f2937;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tool-link-desc {
    font-size: 14px;
    color: #6b7280;
    line-height: 1.5;
  }
  .tool-link-url {
    font-size: 12px;
    color: #3b66f5;
    word-break: break-all;
  }
  .keyboard-hint {
    text-align: center;
    font-size: 13px;
    color: #9ca3af;
    padding: 0 20px 16px;
  }
  /* 弦振动动画 */
  @keyframes vibrate {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-2px); }
    75% { transform: translateX(2px); }
  }
  .vibrating {
    animation: vibrate 0.1s ease-in-out 4;
  }
  @media (max-width: 520px) {
    .card-header h2 { font-size: 22px; }
    .status-item { font-size: 20px; }
    .tab-item { font-size: 18px; padding: 12px 4px; min-width: 60px; }
    .tools-links { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- 主乐器模拟卡片 -->
<div class="instrument-card">
  <div class="card-header">
    <h2>小工具 · 乐器模拟</h2>
    <div class="header-tools" id="staffHeaderTools" style="display:none;">
      <button class="header-tool-btn" id="muteBtn" title="静音/发声">🔇</button>
      <button class="header-tool-btn" id="resetBtn" title="复位">↻</button>
    </div>
    <div class="info-icon" id="infoBtn" title="关于这个工具">i</div>
  </div>

  <div class="instrument-svg-container" id="svgContainer">
    <!-- SVG动态插入 -->
  </div>

  <div class="status-bar">
    <span class="status-item" id="originText">唐朝起源</span>
    <span class="status-divider"></span>
    <span class="status-item" id="playHint">点按琴弦演奏</span>
    <span class="status-divider"></span>
    <span class="status-item" id="statusText">等待演奏</span>
  </div>

  <div class="keyboard-hint" id="keyHint">提示：也可使用键盘数字键 1-8 演奏</div>

  <div class="tab-bar" id="tabBar">
    <button class="tab-item active" data-inst="erhu">二胡</button>
    <button class="tab-item" data-inst="hulusi">葫芦丝</button>
    <button class="tab-item" data-inst="piano">钢琴</button>
    <button class="tab-item" data-inst="guzheng">古筝</button>
    <button class="tab-item" data-inst="guitar">吉他</button>
    <button class="tab-item" data-inst="staff">五线谱</button>
  </div>
</div>

<!-- 乐理工具链接 -->
<div class="tools-links">
  <a href="https://muted.io/cheat-sheet/" target="_blank" class="tool-link-card">
    <div class="tool-link-title">
      <span>📋</span> 乐理速查表
    </div>
    <div class="tool-link-desc">muted.io 完整音乐理论 cheat sheet，涵盖调式、音阶、和弦、音程、音符等全部乐理参考</div>
    <div class="tool-link-url">https://muted.io/cheat-sheet/</div>
  </a>
  <a href="https://circleoffifths.io/zh" target="_blank" class="tool-link-card">
    <div class="tool-link-title">
      <span>🔄</span> 互动五度圈
    </div>
    <div class="tool-link-desc">中文可视化五度圈工具，查看大小调关系、调号、和弦级数，辅助理解调式理论</div>
    <div class="tool-link-url">https://circleoffifths.io/zh</div>
  </a>
</div>

<script>
// ====== Web Audio 初始化 ======
let audioCtx = null;
let staffMuted = true; // 五线谱默认静音

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// 通用音色合成函数
function playNote(freq, duration = 0.8, type = 'triangle', vol = 0.25, attack = 0.02, release = 0.3) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();

  osc.type = type;
  osc.frequency.value = freq;

  filter.type = 'lowpass';
  filter.frequency.value = freq * 3;
  filter.Q.value = 1;

  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(vol, now + attack);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration + release);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + duration + release + 0.1);
}

// 二胡音色（带揉弦效果）
function playErhu(freq, duration = 1.2) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const lfo = ctx.createOscillator();
  const lfoGain = ctx.createGain();
  const filter = ctx.createBiquadFilter();

  osc.type = 'sawtooth';
  osc.frequency.value = freq;

  lfo.frequency.value = 5;
  lfoGain.gain.value = freq * 0.015;
  lfo.connect(lfoGain);
  lfoGain.connect(osc.frequency);

  filter.type = 'lowpass';
  filter.frequency.value = freq * 2.5;
  filter.Q.value = 2;

  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.2, now + 0.05);
  gain.gain.setValueAtTime(0.2, now + duration * 0.7);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration + 0.4);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  lfo.start(now);
  osc.stop(now + duration + 0.5);
  lfo.stop(now + duration + 0.5);
}

// 葫芦丝音色
function playHulusi(freq, duration = 0.9) {
  const ctx = getAudioCtx();
  const osc1 = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();

  osc1.type = 'triangle';
  osc1.frequency.value = freq;
  osc2.type = 'sine';
  osc2.frequency.value = freq * 2;

  filter.type = 'lowpass';
  filter.frequency.value = freq * 2;
  filter.Q.value = 3;

  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.22, now + 0.08);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration + 0.2);

  osc1.connect(filter);
  osc2.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  osc1.start(now);
  osc2.start(now);
  osc1.stop(now + duration + 0.3);
  osc2.stop(now + duration + 0.3);
}

// 钢琴音色
function playPiano(freq, duration = 1.0) {
  const ctx = getAudioCtx();
  const partials = [1, 2, 3, 4];
  const gains = [0.3, 0.15, 0.05, 0.02];
  const masterGain = ctx.createGain();

  partials.forEach((mult, i) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq * mult;
    g.gain.value = gains[i];
    osc.connect(g);
    g.connect(masterGain);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  });

  const now = ctx.currentTime;
  masterGain.gain.setValueAtTime(0.3, now);
  masterGain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  masterGain.connect(ctx.destination);
}

// 古筝音色（拨弦）
function playGuzheng(freq, duration = 1.5) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();

  osc.type = 'triangle';
  osc.frequency.value = freq;

  filter.type = 'bandpass';
  filter.frequency.value = freq * 1.5;
  filter.Q.value = 1.5;

  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.3, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + duration + 0.1);
}

// 吉他音色
function playGuitar(freq, duration = 1.2) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const distortion = ctx.createWaveShaper();

  const curve = new Float32Array(256);
  for (let i = 0; i < 256; i++) {
    const x = (i - 128) / 128;
    curve[i] = (Math.PI + 50) * x / (Math.PI + 50 * Math.abs(x));
  }
  distortion.curve = curve;

  osc.type = 'sawtooth';
  osc.frequency.value = freq;

  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.25, now + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

  osc.connect(distortion);
  distortion.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + duration + 0.1);
}

// ====== 五线谱音符位置数据 ======
// 音名（按半音顺序）
const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const solfegeNames = {'C':'Do','C#':'Do#','D':'Re','D#':'Re#','E':'Mi','F':'Fa','F#':'Fa#','G':'Sol','G#':'Sol#','A':'La','A#':'La#','B':'Si'};

// MIDI频率计算：A4=440Hz, MIDI 69
function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

// 高音谱号：线/间位置对应MIDI
// 五线谱从下往上：线1(E4=64)、间1(F4=65)、线2(G4=67)、间2(A4=69)、线3(B4=71)、间3(C5=72)、线4(D5=74)、间4(E5=76)、线5(F5=77)
// 下加一线：C4=60 (中央C)，下加一间：D4=62，上加一线：A4=69
// 加线与间
const treblePositions = [
  // 从低到高：y值越大音越低
  {y: 340, midi: 60, name: 'C4', pos: '下加一线'},  // C4 下加一线 (Do)
  {y: 325, midi: 62, name: 'D4', pos: '下加一间'},  // D4 下加一间
  {y: 310, midi: 64, name: 'E4', pos: '线1'},        // E4 第一线
  {y: 295, midi: 65, name: 'F4', pos: '间1'},        // F4 第一间
  {y: 280, midi: 67, name: 'G4', pos: '线2'},        // G4 第二线
  {y: 265, midi: 69, name: 'A4', pos: '间2'},        // A4 第二间
  {y: 250, midi: 71, name: 'B4', pos: '线3'},        // B4 第三线
  {y: 235, midi: 72, name: 'C5', pos: '间3'},        // C5 第三间
  {y: 220, midi: 74, name: 'D5', pos: '线4'},        // D5 第四线
  {y: 205, midi: 76, name: 'E5', pos: '间4'},        // E5 第四间
  {y: 190, midi: 77, name: 'F5', pos: '线5'},        // F5 第五线
  {y: 175, midi: 79, name: 'G5', pos: '上加一间'},   // G5 上加一间
  {y: 160, midi: 81, name: 'A5', pos: '上加一线'},   // A5 上加一线
];

// 低音谱号：线/间位置对应MIDI
// 低音谱号（F谱）：线1(G2=43)、间1(A2=45)、线2(B2=47)、间2(C3=48)、线3(D3=50)、间3(E3=52)、线4(F3=53)、间4(G3=55)、线5(A3=57)
// 上加一线：C4=60 (中央C)，上加一间：B3=59
const bassPositions = [
  {y: 340, midi: 43, name: 'G2', pos: '线1'},        // G2 第一线
  {y: 325, midi: 45, name: 'A2', pos: '间1'},        // A2 第一间
  {y: 310, midi: 47, name: 'B2', pos: '线2'},        // B2 第二线
  {y: 295, midi: 48, name: 'C3', pos: '间2'},        // C3 第二间
  {y: 280, midi: 50, name: 'D3', pos: '线3'},        // D3 第三线
  {y: 265, midi: 52, name: 'E3', pos: '间3'},        // E3 第三间
  {y: 250, midi: 53, name: 'F3', pos: '线4'},        // F3 第四线
  {y: 235, midi: 55, name: 'G3', pos: '间4'},        // G3 第四间
  {y: 220, midi: 57, name: 'A3', pos: '线5'},        // A3 第五线
  {y: 205, midi: 59, name: 'B3', pos: '上加一间'},   // B3 上加一间
  {y: 190, midi: 60, name: 'C4', pos: '上加一线'},   // C4 上加一线 (中央C)
  {y: 175, midi: 62, name: 'D4', pos: '上加二间'},   // D4
  {y: 160, midi: 64, name: 'E4', pos: '上加二线'},   // E4
];

let staffState = {
  clef: 'treble', // treble / bass
  currentIdx: 0,  // 当前选中音符在positions数组中的索引（高音默认C4第一加线=索引0）
};

function getNoteLabel(midi) {
  const pc = midi % 12;
  const octave = Math.floor(midi / 12) - 1;
  const noteLetter = noteNames[pc];
  const solfege = solfegeNames[noteLetter];
  return solfege + ' (' + noteLetter + octave + ')';
}

// 绘制高音谱号（G谱号）
function drawTrebleClef(x, y) {
  // 用SVG path绘制标准高音谱号
  return `<path d="M ${x} ${y-80}
    C ${x+12} ${y-100}, ${x+28} ${y-90}, ${x+24} ${y-65}
    C ${x+20} ${y-40}, ${x-5} ${y-35}, ${x-2} ${y-10}
    C ${x+2} ${y+15}, ${x+30} ${y+20}, ${x+28} ${y+45}
    C ${x+26} ${y+70}, ${x+5} ${y+75}, ${x-8} ${y+55}
    C ${x-20} ${y+35}, ${x-15} ${y+5}, ${x+5} ${y-15}
    C ${x+25} ${y-35}, ${x+18} ${y-70}, ${x} ${y-80} Z"
    fill="#2c2c2c"/>
    <ellipse cx="${x+10}" cy="${y-5}" rx="10" ry="8" fill="#f8f9fc" stroke="#2c2c2c" stroke-width="2"/>`;
}

// 绘制低音谱号（F谱号）
function drawBassClef(x, y) {
  return `<path d="M ${x+5} ${y-60}
    C ${x+25} ${y-55}, ${x+30} ${y-20}, ${x+18} ${y}
    C ${x+8} ${y+15}, ${x-10} ${y+15}, ${x-15} ${y-5}
    C ${x-18} ${y-25}, ${x-5} ${y-50}, ${x+5} ${y-60} Z"
    fill="#2c2c2c"/>
    <circle cx="${x+2}" cy="${y+30}" r="5" fill="#2c2c2c"/>
    <circle cx="${x+2}" cy="${y+55}" r="5" fill="#2c2c2c"/>
    <path d="M ${x-5} ${y+20} Q ${x+20} ${y+40}, ${x-5} ${y+70}" stroke="#2c2c2c" stroke-width="4" fill="none" stroke-linecap="round"/>`;
}

// 五线谱SVG渲染
function getStaffSVG() {
  const isTreble = staffState.clef === 'treble';
  const positions = isTreble ? treblePositions : bassPositions;
  const pos = positions[staffState.currentIdx];
  const lineX1 = 130;
  const lineX2 = 480;
  const lineYs = [310, 280, 250, 220, 190]; // 五线从下到上

  // 五线
  let lines = '';
  lineYs.forEach(ly => {
    lines += `<line x1="${lineX1}" y1="${ly}" x2="${lineX2}" y2="${ly}" stroke="#6b7280" stroke-width="1.5"/>`;
  });

  // 线号标注
  const lineLabels = ['线1','线2','线3','线4','线5'];
  lineYs.forEach((ly, i) => {
    lines += `<text x="${lineX2+15}" y="${ly+5}" fill="#9ca3af" font-size="20">${lineLabels[i]}</text>`;
  });

  // 谱号
  const clef = isTreble ? drawTrebleClef(70, 280) : drawBassClef(70, 280);

  // 加线（如果音符位置需要加线）
  let ledgerLines = '';
  // 需要下加线的位置（高音：C4下加一线y=340; 低音：无下加线需要在可见范围内）
  // 需要上加线的位置
  if (isTreble) {
    // C4 下加一线
    if (staffState.currentIdx === 0) {
      ledgerLines += `<line x1="${lineX1+80}" y1="340" x2="${lineX1+130}" y2="340" stroke="#6b7280" stroke-width="1.5"/>`;
    }
    // A5 上加一线
    if (staffState.currentIdx >= 12) {
      ledgerLines += `<line x1="${lineX1+80}" y1="160" x2="${lineX1+130}" y2="160" stroke="#6b7280" stroke-width="1.5"/>`;
    }
  } else {
    // C4 上加一线（低音）
    if (staffState.currentIdx >= 10) {
      ledgerLines += `<line x1="${lineX1+80}" y1="190" x2="${lineX1+130}" y2="190" stroke="#6b7280" stroke-width="1.5"/>`;
      if (staffState.currentIdx >= 12) {
        ledgerLines += `<line x1="${lineX1+80}" y1="160" x2="${lineX1+130}" y2="160" stroke="#6b7280" stroke-width="1.5"/>`;
      }
    }
  }

  // 音符（蓝色符头 + 符干）
  const noteX = lineX1 + 105;
  const noteY = pos.y;
  const noteHead = `<ellipse cx="${noteX}" cy="${noteY}" rx="12" ry="9" fill="#4f6ef7" transform="rotate(-20 ${noteX} ${noteY})" class="staff-note" data-idx="${staffState.currentIdx}"/>`;
  // 符干（向上，从符头右侧向上）
  const stem = `<line x1="${noteX+10}" y1="${noteY-5}" x2="${noteX+10}" y2="${noteY-55}" stroke="#4f6ef7" stroke-width="2.5"/>`;

  // 点击热区（覆盖每个线/间位置）
  let hitAreas = '';
  positions.forEach((p, i) => {
    const topY = i === 0 ? p.y + 8 : (p.y + positions[i-1].y)/2;
    const botY = i === positions.length-1 ? p.y - 8 : (p.y + positions[i+1].y)/2;
    hitAreas += `<rect class="staff-line-hit" x="${lineX1}" y="${Math.min(topY,botY)}" width="${lineX2-lineX1}" height="${Math.abs(topY-botY)}" data-idx="${i}"/>`;
  });

  // 谱号名称标签
  const clefLabel = isTreble
    ? `<text x="60" y="130" fill="#9ca3af" font-size="22">高音谱号</text>`
    : `<text x="60" y="130" fill="#9ca3af" font-size="22">低音谱号</text>`;

  // 底部谱号切换按钮
  const tabBg = `<rect x="30" y="390" width="480" height="52" rx="16" fill="white"/>`;
  const trebleTab = `<g class="staff-clef-tab ${isTreble?'active':''}" data-clef="treble">
    <rect x="40" y="396" width="230" height="40" rx="12" fill="${isTreble?'#f0f4ff':'transparent'}"/>
    <text x="155" y="423" text-anchor="middle" font-size="22" fill="${isTreble?'#3b66f5':'#333'}" font-weight="${isTreble?'700':'500'}">高音谱号（G谱）</text>
  </g>`;
  const bassTab = `<g class="staff-clef-tab ${!isTreble?'active':''}" data-clef="bass">
    <rect x="280" y="396" width="220" height="40" rx="12" fill="${!isTreble?'#f0f4ff':'transparent'}"/>
    <text x="390" y="423" text-anchor="middle" font-size="22" fill="${!isTreble?'#3b66f5':'#333'}" font-weight="${!isTreble?'700':'500'}">低音谱号（F谱）</text>
  </g>`;

  // 当前音符标签
  const noteLabel = getNoteLabel(pos.midi);
  const statusText = `<text x="270" y="378" text-anchor="middle" fill="#9ca3af" font-size="22">${noteLabel} · ${pos.pos}</text>`;

  return `
  <svg viewBox="0 0 540 460" width="100%" style="max-width:540px;" xmlns="http://www.w3.org/2000/svg">
    ${clefLabel}
    ${lines}
    ${ledgerLines}
    ${clef}
    ${hitAreas}
    ${noteHead}
    ${stem}
    ${statusText}
    ${tabBg}
    ${trebleTab}
    ${bassTab}
  </svg>
  `;
}

// 渲染乐器
function renderInstrument(name) {
  const config = instrumentConfig[name];
  const container = document.getElementById('svgContainer');
  container.innerHTML = config.svg();
  document.getElementById('originText').textContent = config.origin;
  document.getElementById('playHint').textContent = config.hint;
  document.getElementById('statusText').textContent = '等待演奏';
  document.getElementById('statusText').classList.remove('playing');

  // 五线谱专用UI显示/隐藏
  const staffTools = document.getElementById('staffHeaderTools');
  const keyHint = document.getElementById('keyHint');
  if (name === 'staff') {
    staffTools.style.display = 'flex';
    keyHint.textContent = '提示：点击谱面任意线/间位置切换音符，右上角可发声/复位';
  } else {
    staffTools.style.display = 'none';
    keyHint.textContent = '提示：也可使用键盘数字键 1-8 演奏';
  }

  bindInstrumentEvents(name);
}

// 绑定点击事件
function bindInstrumentEvents(name) {
  const config = instrumentConfig[name];

  if (name === 'staff') {
    // 五线谱专用交互
    const positions = staffState.clef === 'treble' ? treblePositions : bassPositions;

    // 线间点击
    document.querySelectorAll('.staff-line-hit, .staff-note').forEach(el => {
      el.addEventListener('click', (e) => {
        const idx = parseInt(el.getAttribute('data-idx'));
        if (!isNaN(idx)) {
          staffState.currentIdx = idx;
          const pos = positions[idx];
          // 发声
          if (!staffMuted) {
            playPiano(midiToFreq(pos.midi), 0.6);
          }
          const noteLabel = getNoteLabel(pos.midi);
          document.getElementById('statusText').textContent = noteLabel + ' · ' + pos.pos;
          document.getElementById('statusText').classList.add('playing');
          clearTimeout(window._statusTimer);
          window._statusTimer = setTimeout(() => {
            document.getElementById('statusText').classList.remove('playing');
          }, 1500);
          renderInstrument('staff');
        }
      });
    });

    // 谱号切换
    document.querySelectorAll('.staff-clef-tab').forEach(el => {
      el.addEventListener('click', (e) => {
        const clef = el.getAttribute('data-clef');
        if (clef && clef !== staffState.clef) {
          staffState.clef = clef;
          // 切换谱号时，若当前是C4保持其位置（高音idx=0，低音idx=10）
          const positions = clef === 'treble' ? treblePositions : bassPositions;
          const c4idx = positions.findIndex(p => p.midi === 60);
          staffState.currentIdx = c4idx >= 0 ? c4idx : 0;
          renderInstrument('staff');
        }
      });
    });

    return;
  }

  // 乐器点击
  const clickables = document.querySelectorAll('[data-inst-type="' + name + '"]');
  clickables.forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const freq = parseFloat(el.getAttribute('data-note'));
      if (freq) {
        config.playFn(freq, 1.0);
        document.getElementById('statusText').textContent = '正在演奏 ♪';
        document.getElementById('statusText').classList.add('playing');
        el.classList.add('vibrating');
        setTimeout(() => el.classList.remove('vibrating'), 400);
        clearTimeout(window._statusTimer);
        window._statusTimer = setTimeout(() => {
          document.getElementById('statusText').textContent = '等待演奏';
          document.getElementById('statusText').classList.remove('playing');
        }, 1200);
      }
    });
  });
}

// Tab切换
document.getElementById('tabBar').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab-item');
  if (!tab) return;
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentInst = tab.getAttribute('data-inst');
  renderInstrument(currentInst);
});

// 键盘快捷键
document.addEventListener('keydown', (e) => {
  const key = e.key;
  if (key >= '1' && key <= '8') {
    const idx = parseInt(key) - 1;
    const config = instrumentConfig[currentInst];
    if (config.keyboardMap && config.keyboardMap[idx]) {
      config.playFn(config.keyboardMap[idx], 0.8);
      document.getElementById('statusText').textContent = '正在演奏 ♪';
      document.getElementById('statusText').classList.add('playing');
      clearTimeout(window._statusTimer);
      window._statusTimer = setTimeout(() => {
        document.getElementById('statusText').textContent = '等待演奏';
        document.getElementById('statusText').classList.remove('playing');
      }, 1000);
    }
  }
});

// 五线谱静音按钮
document.getElementById('muteBtn').addEventListener('click', () => {
  staffMuted = !staffMuted;
  const btn = document.getElementById('muteBtn');
  btn.textContent = staffMuted ? '🔇' : '🔊';
  btn.classList.toggle('active', !staffMuted);
});

// 五线谱复位按钮
document.getElementById('resetBtn').addEventListener('click', () => {
  staffState.clef = 'treble';
  staffState.currentIdx = 0;
  renderInstrument('staff');
  document.getElementById('statusText').textContent = '已复位';
  document.getElementById('statusText').classList.add('playing');
  clearTimeout(window._statusTimer);
  window._statusTimer = setTimeout(() => {
    document.getElementById('statusText').classList.remove('playing');
  }, 1000);
});

// 信息按钮
document.getElementById('infoBtn').addEventListener('click', () => {
  alert('🎵 小工具·乐器模拟\n\n五种民族/常用乐器：二胡、葫芦丝、钢琴、古筝、吉他\n+ 五线谱音符位置互动工具\n\n• 直接点击乐器上的音位/音孔/琴弦/琴键即可发声\n• 五线谱页：点击谱面线/间位置可查看对应音名与位置；切换高低音谱号；右上角可开启发声与复位\n• 乐器页支持键盘数字键 1-8 快捷演奏\n• 所有音色由 Web Audio API 实时合成\n• 下方卡片提供乐理速查表和五度圈在线工具入口');
});

// 初始化
renderInstrument('erhu');
</script>
</body>
</html>
