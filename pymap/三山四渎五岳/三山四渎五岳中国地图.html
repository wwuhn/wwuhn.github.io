<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>三山四渎五岳 · 中国地图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/china.js"></script>
    <style>
        * { margin: 0; padding: 0; }
        #main { width: 100vw; height: 100vh; }
        #legend {
            position: absolute;
            left: 45%;
            top: 60px;
            z-index: 10;
            user-select: none;
        }
        .legend-item {
            font-size: 15px;
            font-weight: bold;
            line-height: 1.5;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.25s;
        }
        .legend-item:hover {
            background: rgba(0,0,0,0.06);
        }
        .legend-item.active {
            opacity: 1;
            background: rgba(0,0,0,0.08);
            border-radius: 4px;
        }
        /* 三山四渎五岳图例 */
        #mapkey {
            position: absolute;
            left: 20px;
            bottom: 24px;
            z-index: 10;
            background: rgba(255,255,255,0.92);
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            line-height: 2;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            user-select: none;
        }
        #mapkey .key-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; color: #222; }
        #mapkey .k-tri { color: #2b88b9; font-weight: bold; }
        #mapkey .k-dia { color: #c0392b; font-weight: bold; }
        #mapkey .k-line { font-weight: bold; }
    </style>
</head>
<body>
    <div id="main"></div>
    <div id="legend">
        <div class="legend-item" data-group="1" style="color:#2b88b9">两湖两广两河山</div>
        <div class="legend-item" data-group="2" style="color:#b8c418">川藏云贵蒙吉安</div>
        <div class="legend-item" data-group="3" style="color:#e8943a">四市二区青甘陕</div>
        <div class="legend-item" data-group="4" style="color:#df6a5d">五江二宁福海湾</div>
    </div>
    <div id="mapkey">
        <div class="key-title">三山 · 四渎 · 五岳</div>
        <div><span class="k-tri">▲</span> 三山（黄山 · 庐山 · 雁荡山）</div>
        <div><span class="k-dia">◆</span> 五岳（东岳 · 西岳 · 南岳 · 北岳 · 中岳）</div>
        <div><span class="k-line" style="color:#1f6fb2">━</span> 长江　
             <span class="k-line" style="color:#d4a017">━</span> 黄河</div>
        <div><span class="k-line" style="color:#3aa76d">━</span> 淮河　
             <span class="k-line" style="color:#8e6bbf">━</span> 济水</div>
    </div>
    <div id="slider-box">
        <div id="slider-labels"><span></span><span></span></div>
        <div id="slider-track">
            <div id="slider-range"></div>
            <div class="slider-handle" id="handle-lo"></div>
            <div class="slider-handle" id="handle-hi"></div>
        </div>
    </div>
    <script>
        var chart = echarts.init(document.getElementById('main'));

        var provinceDetail = {
            '湖南':   {capital:'长沙',   area:'21.18', pop:'6492'},
            '湖北':   {capital:'武汉',   area:'18.59', pop:'5811'},
            '广东':   {capital:'广州',   area:'17.97', pop:'12859'},
            '广西':   {capital:'南宁',   area:'23.76', pop:'4989'},
            '河南':   {capital:'郑州',   area:'16.70', pop:'9744'},
            '河北':   {capital:'石家庄', area:'18.88', pop:'7354'},
            '山东':   {capital:'济南',   area:'15.79', pop:'10043'},
            '山西':   {capital:'太原',   area:'15.67', pop:'3424'},
            '四川':   {capital:'成都',   area:'48.60', pop:'8318'},
            '西藏':   {capital:'拉萨',   area:'122.84',pop:'374'},
            '云南':   {capital:'昆明',   area:'39.41', pop:'4644'},
            '贵州':   {capital:'贵阳',   area:'17.61', pop:'3857'},
            '内蒙古': {capital:'呼和浩特',area:'118.30',pop:'2374'},
            '吉林':   {capital:'长春',   area:'18.74', pop:'2297'},
            '安徽':   {capital:'合肥',   area:'14.01', pop:'6082'},
            '北京':   {capital:'北京',   area:'1.64',  pop:'2180'},
            '天津':   {capital:'天津',   area:'1.20',  pop:'1363'},
            '上海':   {capital:'上海',   area:'0.63',  pop:'2485'},
            '重庆':   {capital:'重庆',   area:'8.24',  pop:'3187'},
            '青海':   {capital:'西宁',   area:'72.23', pop:'592'},
            '甘肃':   {capital:'兰州',   area:'42.58', pop:'2443'},
            '陕西':   {capital:'西安',   area:'20.56', pop:'3936'},
            '江苏':   {capital:'南京',   area:'10.72', pop:'8518'},
            '江西':   {capital:'南昌',   area:'16.69', pop:'4474'},
            '浙江':   {capital:'杭州',   area:'10.55', pop:'6701'},
            '黑龙江': {capital:'哈尔滨', area:'47.30', pop:'3001'},
            '宁夏':   {capital:'银川',   area:'6.64',  pop:'732'},
            '新疆':   {capital:'乌鲁木齐',area:'166.00',pop:'2639'},
            '辽宁':   {capital:'沈阳',   area:'14.86', pop:'4131'},
            '福建':   {capital:'福州',   area:'12.40', pop:'4190'},
            '海南':   {capital:'海口',   area:'3.54',  pop:'1055'},
            '台湾':   {capital:'台北',   area:'3.60',  pop:'2340'}
        };

        var abbrMap = {
            '湖南':'湘','湖北':'鄂','广东':'粤','广西':'桂',
            '河南':'豫','河北':'冀','山东':'鲁','山西':'晋',
            '四川':'川','西藏':'藏','云南':'云','贵州':'贵',
            '内蒙古':'蒙','吉林':'吉','安徽':'皖',
            '北京':'京','天津':'津','上海':'沪','重庆':'渝',
            '青海':'青','甘肃':'甘','陕西':'陕',
            '江苏':'苏','江西':'赣','浙江':'浙','黑龙江':'黑',
            '宁夏':'宁','新疆':'新',
            '辽宁':'辽','福建':'闽','海南':'琼','台湾':'台'
        };

        // ===== 新增：三山、五岳详情（悬停提示用） =====
        var mountainDetail = {
            '黄山':   {type:'三山', province:'安徽 黄山',   peak:'莲花峰 1864.8 米', desc:'世界文化与自然双重遗产，"黄山归来不看岳"'},
            '庐山':   {type:'三山', province:'江西 九江',   peak:'汉阳峰 1474 米',   desc:'避暑胜地，白鹿洞书院所在地；"不识庐山真面目"'},
            '雁荡山': {type:'三山', province:'浙江 温州乐清', peak:'百岗尖 1056.5 米', desc:'"东南第一山"，以灵峰夜景、灵岩飞渡著称'},
            '东岳泰山': {type:'五岳', province:'山东 泰安', peak:'玉皇顶 1545 米',   desc:'五岳独尊，历代帝王封禅圣地'},
            '西岳华山': {type:'五岳', province:'陕西 华阴', peak:'南峰 2154.9 米',   desc:'五岳最高、以"奇险天下第一山"闻名'},
            '南岳衡山': {type:'五岳', province:'湖南 衡阳', peak:'祝融峰 1300.2 米', desc:'五岳独秀，古称"寿岳"，"寿比南山"即此'},
            '北岳恒山': {type:'五岳', province:'山西 大同浑源', peak:'天峰岭 2016.1 米', desc:'北方边塞雄山，悬空寺镶嵌于峭壁之上'},
            '中岳嵩山': {type:'五岳', province:'河南 登封', peak:'峻极峰 1491.7 米', desc:'"天地之中"，少林寺所在地，三教荟萃'}
        };

        // ===== 新增：四渎详情（悬停提示用） =====
        var riverDetail = {
            '长江': {len:'约 6300 公里', desc:'世界第三长河，四渎之首，贯通南方文明'},
            '黄河': {len:'约 5464 公里', desc:'中华民族母亲河，孕育仰韶、龙山文化'},
            '淮河': {len:'约 1000 公里', desc:'中国南北地理分界线的重要标识'},
            '济水': {len:'古河道已湮没', desc:'"三隐三现、过黄河而不浊"，济源济南因之得名'}
        };

        // ===== 新增：四渎河流走向（经度, 纬度） =====
        var riverPaths = {
            '长江': {color:'#1f6fb2', path:[[91.0,33.5],[96.5,31.0],[98.5,28.5],[99.9,26.9],[101.7,26.6],[104.6,28.8],[106.5,29.6],[108.5,30.5],[110.0,30.8],[112.0,30.3],[114.3,30.6],[116.0,29.7],[117.8,30.9],[118.8,32.0],[120.5,31.9],[121.5,31.4]]},
            '黄河': {color:'#d4a017', path:[[96.0,35.0],[103.0,36.0],[105.0,37.5],[106.3,38.5],[106.4,39.2],[107.4,40.7],[110.0,40.6],[111.5,40.3],[111.2,39.4],[110.7,37.5],[110.5,36.1],[110.3,34.6],[111.4,34.8],[113.6,34.9],[114.3,34.9],[115.5,35.3],[117.1,36.7],[118.7,37.7]]},
            '淮河': {color:'#3aa76d', path:[[113.2,32.4],[114.1,32.1],[115.4,32.5],[116.5,32.7],[117.3,32.9],[118.5,33.1],[119.2,33.5],[120.3,34.0]]},
            '济水': {color:'#8e6bbf', path:[[112.6,35.1],[113.5,35.2],[114.6,35.5],[115.9,35.9],[117.0,36.7],[118.3,37.2],[119.1,37.5]]}
        };

        // 四渎 -> lines 系列的折线数据（每条河一条折线）
        var riverLineData = Object.keys(riverPaths).map(function(rn) {
            return {
                name: rn,
                coords: riverPaths[rn].path,
                lineStyle: { color: riverPaths[rn].color, width: 3.5 }
            };
        });

        // 当前激活的分组，0表示无激活（全部显示）
        var activeGroup = 0;

        var provinceInfo = [
            {name:'湖南',group:1},{name:'湖北',group:1},{name:'广东',group:1},{name:'广西',group:1},
            {name:'河南',group:1},{name:'河北',group:1},{name:'山东',group:1},{name:'山西',group:1},
            {name:'四川',group:2},{name:'西藏',group:2},{name:'云南',group:2},{name:'贵州',group:2},
            {name:'内蒙古',group:2},{name:'吉林',group:2},{name:'安徽',group:2},
            {name:'北京',group:3},{name:'天津',group:3},{name:'上海',group:3},{name:'重庆',group:3},
            {name:'青海',group:3},{name:'甘肃',group:3},{name:'陕西',group:3},
            {name:'江苏',group:4},{name:'江西',group:4},{name:'浙江',group:4},{name:'黑龙江',group:4},
            {name:'宁夏',group:4},{name:'新疆',group:4},
            {name:'辽宁',group:4},{name:'福建',group:4},{name:'海南',group:4},{name:'台湾',group:4}
        ];

        // 为每个省份生成随机全色相颜色
        function randomColor() {
            var h = Math.floor(Math.random() * 360);
            var s = 60 + Math.floor(Math.random() * 25);
            var l = 45 + Math.floor(Math.random() * 15);
            return 'hsl(' + h + ',' + s + '%,' + l + '%)';
        }
        provinceInfo.forEach(function(p) { p.randColor = randomColor(); });

        // 拖拽范围 [0~100]
        var dragMin = 0, dragMax = 100;

        function getDisplayData() {
            return provinceInfo.map(function(p) {
                var val = p.group * 25;
                // 拖拽范围外 → 白色
                if (val < dragMin || val > dragMax) {
                    return {name:p.name, value:val, itemStyle:{areaColor:'#ffffff', borderColor:'#ccc'}};
                }
                // 有激活分组时：非该组 → 白色，该组 → 随机色
                if (activeGroup > 0 && p.group !== activeGroup) {
                    return {name:p.name, value:val, itemStyle:{areaColor:'#ffffff', borderColor:'#ccc'}};
                }
                // 默认：随机色
                return {name:p.name, value:val, itemStyle:{areaColor:p.randColor, borderColor:'#888'}};
            });
        }

        function updateDisplay() {
            chart.setOption({ series: [{ data: getDisplayData() }] });
        }

        // ===== 新增：三山、五岳标记点（含名称标签） =====
        var mountainPoints = [
            {name:'黄山',     coord:[118.17, 30.13]},
            {name:'庐山',     coord:[115.99, 29.55]},
            {name:'雁荡山',   coord:[121.05, 28.37]},
            {name:'东岳泰山', coord:[117.10, 36.25]},
            {name:'西岳华山', coord:[110.09, 34.48]},
            {name:'南岳衡山', coord:[112.69, 27.25]},
            {name:'北岳恒山', coord:[113.73, 39.67]},
            {name:'中岳嵩山', coord:[113.02, 34.49]}
        ];

        function buildMountainPoints() {
            return mountainPoints.map(function(m) {
                var isSan = (m.name === '黄山' || m.name === '庐山' || m.name === '雁荡山');
                var color = isSan ? '#2b88b9' : '#c0392b';
                return {
                    name: m.name,
                    coord: m.coord,
                    symbol: isSan ? 'triangle' : 'diamond',
                    symbolSize: 15,
                    itemStyle: { color: color, borderColor: '#ffffff', borderWidth: 1.5 },
                    label: {
                        show: true,
                        position: 'top',
                        distance: 6,
                        formatter: '{b}',
                        color: color,
                        fontSize: 11,
                        fontWeight: 'bold',
                        textBorderColor: '#ffffff',
                        textBorderWidth: 2
                    }
                };
            });
        }

        var option = {
            title: {
                text: '三山四渎五岳 · 中国地图',
                left: 20,
                top: 20,
                textStyle: { fontSize: 20, fontWeight: 'bold', color: '#333' }
            },
            tooltip: {
                trigger: 'item',
                formatter: function(params) {
                    var name = params.name;
                    // 三山 / 五岳
                    if (mountainDetail[name]) {
                        var m = mountainDetail[name];
                        return '<b style="font-size:15px">' + name + '</b>　【' + m.type + '】'
                            + '<br/>所在地：' + m.province
                            + '<br/>主峰：' + m.peak
                            + '<br/><span style="color:#666">' + m.desc + '</span>';
                    }
                    // 四渎
                    if (riverDetail[name]) {
                        var r = riverDetail[name];
                        return '<b style="font-size:15px">' + name + '</b>　【四渎】'
                            + '<br/>长度：' + r.len
                            + '<br/><span style="color:#666">' + r.desc + '</span>';
                    }
                    // 省份
                    var info = provinceDetail[name];
                    if (!info) return name;
                    return '<b style="font-size:15px">' + name + '(' + (abbrMap[name]||'') + ')' + '</b>'
                        + '<br/>省会：' + info.capital
                        + '<br/>面积：' + info.area + ' 万km²'
                        + '<br/>人口：' + info.pop + ' 万人';
                },
                extraCssText: 'line-height:1.8;'
            },
            toolbox: {
                show: true,
                right: 20,
                top: 'center',
                orient: 'vertical',
                feature: {
                    saveAsImage: { show: true, title: '保存为图片' },
                    restore: { show: true, title: '重置' },
                    dataView: { show: true, title: '数据视图' }
                }
            },
            // 隐藏的地理坐标系：只用于承载四渎河流线，与地图系列共用同一套经纬度投影
            geo: {
                map: 'china',
                roam: true,
                silent: true,
                label: { show: false },
                itemStyle: { areaColor: 'rgba(0,0,0,0)', borderColor: 'rgba(0,0,0,0)', borderWidth: 0 }
            },
            series: [
                {
                    name: '省份',
                    type: 'map',
                    mapType: 'china',
                    roam: true,
                    z: 5,
                    label: {
                        show: true,
                        fontSize: 11,
                        color: '#000'
                    },
                    itemStyle: {
                        areaColor: '#e0e0e0',
                        borderColor: '#888'
                    },
                    emphasis: {
                        label: { show: true, fontSize: 13, fontWeight: 'bold' },
                        itemStyle: {
                            areaColor: '#f5f5f5',
                            borderColor: '#333'
                        }
                    },
                    data: getDisplayData(),
                    markPoint: {
                        symbol: 'circle',
                        symbolSize: 6,
                        itemStyle: { color: '#9aa0a6', borderColor: '#ffffff', borderWidth: 1 },
                        label: { show: false },
                        data: [
                            {name:'长沙',coord:[112.94,28.23]},
                            {name:'武汉',coord:[114.31,30.59]},
                            {name:'广州',coord:[113.26,23.13]},
                            {name:'南宁',coord:[108.32,22.82]},
                            {name:'郑州',coord:[113.65,34.76]},
                            {name:'石家庄',coord:[114.48,38.03]},
                            {name:'济南',coord:[117.00,36.65]},
                            {name:'太原',coord:[112.55,37.87]},
                            {name:'成都',coord:[104.07,30.67]},
                            {name:'拉萨',coord:[91.13,29.66]},
                            {name:'昆明',coord:[102.73,25.04]},
                            {name:'贵阳',coord:[106.71,26.57]},
                            {name:'呼和浩特',coord:[111.65,40.82]},
                            {name:'长春',coord:[125.35,43.88]},
                            {name:'合肥',coord:[117.27,31.86]},
                            {name:'北京',coord:[116.46,39.92]},
                            {name:'天津',coord:[117.20,39.13]},
                            {name:'上海',coord:[121.48,31.22]},
                            {name:'重庆',coord:[106.54,29.59]},
                            {name:'银川',coord:[106.27,38.47]},
                            {name:'乌鲁木齐',coord:[87.68,43.77]},
                            {name:'西宁',coord:[101.74,36.56]},
                            {name:'兰州',coord:[103.83,36.06]},
                            {name:'西安',coord:[108.95,34.27]},
                            {name:'南京',coord:[118.78,32.04]},
                            {name:'南昌',coord:[115.89,28.68]},
                            {name:'杭州',coord:[120.19,30.26]},
                            {name:'哈尔滨',coord:[126.63,45.75]},
                            {name:'沈阳',coord:[123.38,41.80]},
                            {name:'福州',coord:[119.30,26.08]},
                            {name:'海口',coord:[110.35,20.02]},
                            {name:'台北',coord:[121.50,25.03]}
                        ].concat(buildMountainPoints())
                    }
                },
                {
                    // 四渎：四条河流走线
                    name: '四渎',
                    type: 'lines',
                    coordinateSystem: 'geo',
                    polyline: true,
                    z: 10,
                    silent: false,
                    label: { show: false },
                    lineStyle: { opacity: 0.95 },
                    emphasis: { lineStyle: { width: 6, opacity: 1 } },
                    data: riverLineData
                }
            ]
        };

        chart.setOption(option);

        // 让承载四渎的隐藏 geo 跟随地图缩放/拖动，保证河流与省份始终对齐
        chart.on('georoam', function(params) {
            if (!params || params.componentType !== 'series') return;
            var cur = chart.getOption();
            var s = cur.series[0];
            if (!s || !s.center || s.zoom == null) return;
            chart.setOption({ geo: { center: s.center, zoom: s.zoom } });
        });

        // ========== 自定义双滑块拖拽 ==========
        var track = document.getElementById('slider-track');
        var rangeDiv = document.getElementById('slider-range');
        var handleLo = document.getElementById('handle-lo');
        var handleHi = document.getElementById('handle-hi');
        var dragging = null;

        function percentToVal(p) { return Math.round(Math.max(0, Math.min(100, p))); }

        function updateSliderUI() {
            handleLo.style.left = dragMin + '%';
            handleHi.style.left = dragMax + '%';
            rangeDiv.style.left = dragMin + '%';
            rangeDiv.style.width = (dragMax - dragMin) + '%';
        }
        updateSliderUI();

        function onPointerDown(e, which) {
            e.preventDefault();
            dragging = which;
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('mouseup', onPointerUp);
        }
        function onPointerMove(e) {
            if (!dragging) return;
            var rect = track.getBoundingClientRect();
            var pct = ((e.clientX - rect.left) / rect.width) * 100;
            pct = percentToVal(pct);
            if (dragging === 'lo') {
                dragMin = Math.min(pct, dragMax - 1);
            } else {
                dragMax = Math.max(pct, dragMin + 1);
            }
            updateSliderUI();
            updateDisplay();
        }
        function onPointerUp() {
            dragging = null;
            document.removeEventListener('mousemove', onPointerMove);
            document.removeEventListener('mouseup', onPointerUp);
        }
        handleLo.addEventListener('mousedown', function(e) { onPointerDown(e, 'lo'); });
        handleHi.addEventListener('mousedown', function(e) { onPointerDown(e, 'hi'); });

        // ========== 口诀点击事件（反显模式） ==========
        var legendItems = document.querySelectorAll('.legend-item');
        legendItems.forEach(function(item) {
            item.addEventListener('click', function() {
                var group = parseInt(this.getAttribute('data-group'));
                if (activeGroup === group) {
                    // 再次点击同一组 → 取消反显，恢复全部显示
                    activeGroup = 0;
                    legendItems.forEach(function(el) { el.classList.remove('active'); });
                } else {
                    // 点击新组 → 反显该组（其他组变白）
                    activeGroup = group;
                    legendItems.forEach(function(el) { el.classList.remove('active'); });
                    this.classList.add('active');
                }
                updateDisplay();
            });
        });

        window.addEventListener('resize', function() { chart.resize(); });
    </script>
</body>
