<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飘洋过海来看你</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 保证视频完整显示，不裁剪 */
        }
    </style>
</head>
<body>

    <!-- 
        使用说明：
        1. 将你的视频文件重命名为 video.mp4
        2. 把这个 video.mp4 和 这个 html 文件放在同一个文件夹
        3. 双击打开 html 即可
    -->
    <video id="player" controls autoplay playsinline>
        <source src="飘洋过海来看你.mp4" type="video/mp4">
        您的浏览器不支持视频播放
    </video>

    <script>
        // 点击视频后，如果处于静音状态，自动开启声音
        const player = document.getElementById('player');
        player.addEventListener('click', () => {
            if (player.muted) {
                player.muted = false;
            }
        });
    </script>

</body>
</html>
