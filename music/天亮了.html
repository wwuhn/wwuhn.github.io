<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天亮了</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 20px;
        }
        
        /* 文字标题样式 */
        .lineup-text {
            text-align: center;
            font-size: 18px;
            line-height: 1.5;
            color: #fff;
            margin-bottom: 10px;
            padding: 5px 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        /* 视频播放器 */
        video {
            width: 100%;
            max-width: 900px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>

    <!-- 歌手阵容文字 -->
    <p class="lineup-text">《我是歌手》第三季(15年)首发：孙楠69、A-Lin（黄丽玲83台湾）、胡彦斌83、陈洁仪(72新加坡)、张靓颖84，韩红71</p>
    
    <!-- 视频播放器 -->
    <video id="player" controls autoplay playsinline>
        <source src="天亮了.mp4" type="video/mp4">
        您的浏览器不支持视频播放
    </video>

    <script>
        // 点击视频后，如果处于静音状态，自动开启声音
        const player = document.getElementById('player');
        player.addEventListener('click', () => {
            if (player.muted) {
                player.muted = false;
            }
        });
    </script>

</body>
</html>
