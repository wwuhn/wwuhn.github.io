<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梦 - 李叔同 - 歌词展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* 歌词容器：严格限制高度，确保一屏显示 */
        .lyrics-box {
            width: 100%;
            max-width: 800px;
            max-height: 400px; /* 歌词区域高度，远小于1000 */
            overflow-y: auto;
            padding: 20px;
            text-align: center;
            line-height: 1.8;
            font-size: 16px;
            opacity: 0.8;
        }
        
        /* 隐藏滚动条但保留功能 */
        .lyrics-box::-webkit-scrollbar { width: 0; }
        
        /* 当前高亮行 */
        .lyrics-box p.active {
            color: #4CAF50;
            font-size: 20px;
            font-weight: bold;
            opacity: 1;
            transition: all 0.3s ease;
        }
        
        /* 音频播放器 */
        audio {
            margin-top: 30px;
            width: 100%;
            max-width: 800px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="lyrics-box" id="lyricsBox">
        <!-- 歌词将通过JS生成 -->
    </div>
    
<audio id="audioPlayer" controls>
        <source src="梦.mp3" type="audio/mpeg">
        您的浏览器不支持音频播放
    </audio>

<script>
    // 歌词数据 [时间(秒), "歌词"]
    const lyricsData = [
        [0, "梦 · 李叔同"],
        [36, "哀游子茕茕其无依兮 在天之涯"],
        [50, "惟长夜漫漫而独寐兮 时恍惚以魂驰"],
        [62, "萝偃卧摇篮以啼笑兮 似婴儿时"],
        [78, "母食我甘酪与粉饵兮 父衣我以彩衣"],

        [92, "月落乌啼 梦影依稀 往事知不知"],
        [104, "汩半生哀乐之长逝兮 感亲之恩其永垂"],
		
		[120, "……"],	
			
        [164, "哀游子怆怆而自怜兮 吊形影悲"],
        [175, "惟长夜漫漫而独寐兮 时恍惚以魂驰"],
		
        [186, "梦挥泪出门辞父母兮 叹生别离"],
        [198, "父语我眠食宜珍重兮 母语我以早归"],
        [211, "日落乌啼 梦影依稀 往事知不知"],
        [222, "汩半生哀乐之长逝兮 感亲之恩其永垂"],
		[235, "日落乌啼 梦影依稀 往事知不知"],
		[246, "汩半生哀乐之长逝兮 感亲之恩其永垂"],
        [258, "感亲之恩其永垂"],
        [270, "—— 完 ——"]
    ];

    const audio = document.getElementById('audioPlayer');
    const lyricsBox = document.getElementById('lyricsBox');
    let currentLineIndex = -1;

    // 初始化歌词
    function initLyrics() {
        lyricsBox.innerHTML = '';
        lyricsData.forEach((item, index) => {
            const p = document.createElement('p');
            p.textContent = item[1];
            p.dataset.time = item[0];
            p.dataset.index = index;
            lyricsBox.appendChild(p);
        });
    }

    // 更新高亮
    function updateLyrics() {
        const currentTime = audio.currentTime;
        let newIndex = -1;

        // 找到当前时间对应的歌词
        for (let i = lyricsData.length - 1; i >= 0; i--) {
            if (currentTime >= lyricsData[i][0]) {
                newIndex = i;
                break;
            }
        }

        if (newIndex !== currentLineIndex && newIndex !== -1) {
            // 移除旧高亮
            const oldActive = lyricsBox.querySelector('.active');
            if (oldActive) oldActive.classList.remove('active');

            // 添加新高亮
            const newActive = lyricsBox.children[newIndex];
            if (newActive) {
                newActive.classList.add('active');
                // 自动滚动到可视区域
                newActive.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            currentLineIndex = newIndex;
        }
    }

    // 绑定事件
    audio.addEventListener('timeupdate', updateLyrics);
    audio.addEventListener('loadedmetadata', () => {
        initLyrics();
        updateLyrics();
        // 尝试自动播放（浏览器可能因策略阻止）
        audio.play().catch(e => console.log("自动播放需用户交互"));
    });

</script>
</body>
</html>
