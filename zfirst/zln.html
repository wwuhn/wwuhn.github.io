<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>河南辉县对头寺 - Esri卫星影像</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d1b2a; color: #e0e0e0; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; }

/* 顶部标题栏 */
.header {
  background: linear-gradient(135deg, #16213e, #0f3460);
  border-bottom: 2px solid #4fc3f7;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header h1 { font-size: 18px; color: #fff; }
.header .subtitle { font-size: 12px; color: #aaa; margin-top: 4px; }
.header .coords { font-size: 12px; color: #4fc3f7; font-family: monospace; text-align: right; }

/* 地图容器 */
#map { width: 100%; height: calc(100vh - 60px); }

/* 信息面板 */
.info-panel {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(13, 27, 42, 0.92);
  border: 1px solid #4fc3f7;
  border-radius: 8px;
  padding: 14px 18px;
  font-size: 13px;
  line-height: 2;
  z-index: 1000;
  min-width: 220px;
}
.info-panel .label { color: #888; }
.info-panel .value { color: #4fc3f7; font-weight: bold; }

/* 图例 */
.legend {
  position: absolute;
  bottom: 30px;
  left: 12px;
  background: rgba(13, 27, 42, 0.9);
  border: 1px solid #333;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 11px;
  line-height: 2;
  z-index: 1000;
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* 底图切换按钮组 */
.map-toggle {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.map-toggle button {
  padding: 8px 14px;
  border: 1px solid #4fc3f7;
  border-radius: 6px;
  background: rgba(13, 27, 42, 0.92);
  color: #e0e0e0;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}
.map-toggle button:hover { background: rgba(79, 195, 247, 0.2); }
.map-toggle button.active { background: rgba(79, 195, 247, 0.35); border-color: #fff; color: #fff; }

/* 比例尺提示 */
.scale-info {
  position: absolute;
  bottom: 12px;
  right: 12px;
  background: rgba(13, 27, 42, 0.9);
  border: 1px solid #333;
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 11px;
  color: #aaa;
  z-index: 1000;
}
.scale-info .val { color: #4fc3f7; font-weight: bold; }

/* Leaflet 控件样式覆盖 */
.leaflet-control-zoom a {
  background: rgba(13, 27, 42, 0.92) !important;
  color: #4fc3f7 !important;
  border-color: #333 !important;
}
.leaflet-control-zoom a:hover {
  background: rgba(79, 195, 247, 0.3) !important;
}
.leaflet-control-attribution {
  background: rgba(13, 27, 42, 0.85) !important;
  color: #666 !important;
  font-size: 10px !important;
}
.leaflet-control-attribution a { color: #4fc3f7 !important; }
.leaflet-tile-pane { filter: saturate(0.9) contrast(1.05); }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>河南辉县对头寺</h1>
    <div class="subtitle">Esri World_Imagery 卫星影像 · Leaflet.js 地图</div>
  </div>
  <div class="coords" id="coordDisplay">
    纬度: 35.528795°N &nbsp; 经度: 113.534648°E
  </div>
</div>

<div id="map"></div>

<div class="info-panel" id="infoPanel">
  <div><span class="label">当前位置：</span><span class="value">35.528795°N, 113.534648°E</span></div>
  <div><span class="label">所属乡镇：</span><span class="value">上八里镇</span></div>
  <div><span class="label">所属县市：</span><span class="value">辉县市（新乡市）</span></div>
  <div><span class="label">所属省份：</span><span class="value">河南省</span></div>
  <div><span class="label">行政区划代码：</span><span class="value">410782109</span></div>
  <div><span class="label">海拔：</span><span class="value">约1100m</span></div>
  <div><span class="label">缩放级别：</span><span class="value" id="zoomLevel">18</span></div>
  <div><span class="label">鼠标坐标：</span><span class="value" id="mouseCoord">—</span></div>
</div>

<div class="map-toggle">
  <button id="btnSat" onclick="switchBase('sat')"> 卫星影像 + 标注</button>
  <button id="btnSatPure" class="active" onclick="switchBase('satPure')"> 纯卫星影像</button>
  <button id="btnStreet" onclick="switchBase('street')"> 街道地图</button>
</div>

<div class="legend">
  <div class="legend-item" data-target="35.528795,113.534648" data-zoom="16"><span class="legend-dot" style="background:#e94560"></span> 对头寺</div>
  <div class="legend-item" data-target="35.526411,113.532861" data-zoom="16"><span class="legend-dot" style="background:#ffeb3b"></span> 女儿缝</div>
  <div class="legend-item" data-target="35.5313,113.5392" data-zoom="14"><span class="legend-dot" style="background:#9b59b6"></span> 张良庙</div>
  <div class="legend-item" data-target="35.535352,113.546471" data-zoom="14"><span class="legend-dot" style="background:#e74c3c"></span> 张良脑</div>
  <div class="legend-item" data-target="35.556,113.538" data-zoom="13"><span class="legend-dot" style="background:#4fc3f7"></span> 关山国家地质公园</div>
</div>

<div class="scale-info">
  比例尺: <span class="val" id="scaleValue">—</span> &nbsp;|&nbsp; 当前视图范围: <span class="val" id="boundsInfo">—</span>
</div>

<script>
// ===== 坐标定义 =====
// 对头寺中心（2026-08-22 调整至 35.528795°N, 113.534648°E）
const DUITOULSI = [35.528795, 113.534648];
// 女儿缝（对头寺南侧悬崖步道）
const NVTI = [35.526411, 113.532861];
// 关山国家地质公园
const GUANSHAN = [35.556, 113.538];
// 张良庙（对头寺东北侧山崖台地，海拔约1400m，距对头寺约0.5km）
const ZHANGMIANG = [35.5313, 113.5392];
// 张良脑/张良垴（山顶主峰，海拔1530-1570m，距对头寺约1.3km）
const ZHANGLIANGNAO = [35.535352, 113.546471];

// ===== 底图图层 =====
// Esri World_Imagery（带标注）
const esriImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Esri',
  maxZoom: 18
});

// Esri World_Imagery + Esri World_Topo_Map 标注叠加
const esriLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Esri',
  maxZoom: 18,
  opacity: 0.6
});

// Esri World_Imagery 纯卫星（无标注）
const esriImageryPure = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Esri',
  maxZoom: 18
});

// OpenStreetMap 街道地图
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{y}/{x}.png', {
  attribution: 'OpenStreetMap',
  maxZoom: 18
});

// ===== 地图初始化 =====
// 默认底图：纯卫星影像（satPure），缩放级别18
const map = L.map('map', {
  center: [35.528795, 113.534648],
  zoom: 18,
  zoomControl: true,
  layers: [esriImageryPure]  // 默认：纯卫星影像
});

// ===== 比例尺控件 =====
L.control.scale({
  position: 'bottomright',
  imperial: false,
  metric: true,
  maxWidth: 200
}).addTo(map);

// ===== 标记点 =====
// 对头寺中心标记
const markerBzl = L.marker(DUITOULSI, {
  title: '对头寺',
  icon: L.divIcon({
    className: 'custom-marker',
    html: '<div style="width:16px;height:16px;background:#e94560;border-radius:50%;border:2px solid #fff;box-shadow:0 0 10px rgba(233,69,96,0.6);"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  })
}).addTo(map);

markerBzl.bindPopup(`
  <div style="font-family:Microsoft YaHei;min-width:180px;">
    <b style="font-size:14px;color:#e94560;">对头寺</b><br/>
    <span style="color:#666;">河南省新乡市辉县市上八里镇鸭口村</span><br/>
    <span style="color:#4fc3f7;">坐标: 35.528795°N, 113.534648°E</span><br/>
    <span style="color:#aaa;">海拔约1100m | 区划代码: 410782109</span><br/>
    <span style="color:#aaa;">始建于西汉初年 | 原名兴复寺</span>
  </div>
`).openPopup();

// 女儿缝（对头寺南侧悬崖步道）
L.marker(NVTI, {
  title: '女儿缝'
}).addTo(map).bindPopup(`
  <div style="font-family:Microsoft YaHei;">
    <b style="color:#ffeb3b;">女儿梯</b><br/>
    <span style="color:#666;">悬崖石阶步道</span><br/>
    <span style="color:#4fc3f7;">坐标: 35.526411°N, 113.532861°E</span><br/>
    <span style="color:#aaa;">距对头寺约310m（南侧）· 白陉古道入口</span>
  </div>
`);

// 关山国家地质公园
L.marker(GUANSHAN, {
  title: '关山国家地质公园'
}).addTo(map).bindPopup(`
  <div style="font-family:Microsoft YaHei;">
    <b style="color:#4fc3f7;">关山国家地质公园</b><br/>
    <span style="color:#666;">太行山南麓</span><br/>
    <span style="color:#4fc3f7;">坐标: 35.5560°N, 113.5380°E</span><br/>
    <span style="color:#aaa;">距对头寺约2km（东侧）</span>
  </div>
`);

// 张良庙（对头寺东北侧山腰）
L.marker(ZHANGMIANG, {
  title: '张良庙'
}).addTo(map).bindPopup(`
  <div style="font-family:Microsoft YaHei;">
    <b style="color:#9b59b6;">张良庙（子房宫）</b><br/>
    <span style="color:#666;">秦汉遗址 · 山崖台地</span><br/>
    <span style="color:#4fc3f7;">坐标: 35.5313°N, 113.5392°E</span><br/>
    <span style="color:#aaa;">海拔约1400m | 距对头寺约0.5km（东北）</span><br/>
    <span style="color:#aaa;">仅存石质山门、叠瓦式青石屋顶石刻遗存，无塑像、无香火</span>
  </div>
`);

// 张良脑/张良垴（山顶主峰）
L.marker(ZHANGLIANGNAO, {
  title: '张良脑'
}).addTo(map).bindPopup(`
  <div style="font-family:Microsoft YaHei;">
    <b style="color:#e74c3c;">张良脑（张良垴）</b><br/>
    <span style="color:#666;">主峰 · 海拔1530-1570m</span><br/>
    <span style="color:#4fc3f7;">坐标: 35.535352°N, 113.546471°E</span><br/>
    <span style="color:#aaa;">距对头寺约1.3km（东北）· 距张良庙约0.8km（东北）</span><br/>
    <span style="color:#aaa;">山顶残存张良庙遗址、张良洞（天然溶洞群）</span><br/>
    <span style="color:#e74c3c;">⚠ 完全未开发野山，无步道、无信号、无补给</span>
  </div>
`);

// ===== 底图切换 =====
function switchBase(type) {
  // 移除所有 TileLayer
  map.eachLayer(layer => {
    if (layer instanceof L.TileLayer) {
      map.removeLayer(layer);
    }
  });

  // 重新添加标记
  L.marker(DUITOULSI, {
    icon: L.divIcon({
      className: 'custom-marker',
      html: '<div style="width:16px;height:16px;background:#e94560;border-radius:50%;border:2px solid #fff;box-shadow:0 0 10px rgba(233,69,96,0.6);"></div>',
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    })
  }).addTo(map);

  L.marker(NVTI, {
    icon: L.divIcon({
      className: 'custom-marker',
      html: '<div style="width:16px;height:16px;background:#ffeb3b;border-radius:50%;border:2px solid #fff;box-shadow:0 0 10px rgba(255,235,59,0.6);"></div>',
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    })
  }).addTo(map);

  L.marker(ZHANGMIANG, {
    icon: L.divIcon({
      className: 'custom-marker',
      html: '<div style="width:16px;height:16px;background:#9b59b6;border-radius:50%;border:2px solid #fff;box-shadow:0 0 10px rgba(155,89,182,0.6);"></div>',
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    })
  }).addTo(map);

  L.marker(ZHANGLIANGNAO, {
    icon: L.divIcon({
      className: 'custom-marker',
      html: '<div style="width:16px;height:16px;background:#e74c3c;border-radius:50%;border:2px solid #fff;box-shadow:0 0 10px rgba(231,76,60,0.6);"></div>',
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    })
  }).addTo(map);

  L.marker(GUANSHAN, {
    icon: L.divIcon({
      className: 'custom-marker',
      html: '<div style="width:16px;height:16px;background:#4fc3f7;border-radius:50%;border:2px solid #fff;box-shadow:0 0 10px rgba(79,195,247,0.6);"></div>',
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    })
  }).addTo(map);

  switch(type) {
    case 'sat':
      // 卫星影像 + 标注
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 18
      }).addTo(map);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
        opacity: 0.6
      }).addTo(map);
      document.getElementById('btnSat').classList.add('active');
      document.getElementById('btnSatPure').classList.remove('active');
      document.getElementById('btnStreet').classList.remove('active');
      break;

    case 'satPure':
      // 纯卫星影像
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 18
      }).addTo(map);
      document.getElementById('btnSat').classList.remove('active');
      document.getElementById('btnSatPure').classList.add('active');
      document.getElementById('btnStreet').classList.remove('active');
      break;

    case 'street':
      // 街道地图
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{y}/{x}.png', {
        attribution: 'OpenStreetMap',
        maxZoom: 18
      }).addTo(map);
      document.getElementById('btnSat').classList.remove('active');
      document.getElementById('btnSatPure').classList.remove('active');
      document.getElementById('btnStreet').classList.add('active');
      break;
  }
}

// ===== 实时更新信息 =====
map.on('mousemove', function(e) {
  const lat = e.latlng.lat.toFixed(6);
  const lng = e.latlng.lng.toFixed(6);
  document.getElementById('mouseCoord').textContent = `${lat}°N, ${lng}°E`;
});

map.on('zoomend', function() {
  document.getElementById('zoomLevel').textContent = map.getZoom();
  updateScaleInfo();
});

map.on('moveend', function() {
  updateScaleInfo();
  updateBoundsInfo();
});

function updateScaleInfo() {
  const zoom = map.getZoom();
  // Leaflet 比例尺近似计算（米/像素）
  const metersPerPixel = 156543.03392 * Math.cos(35.528795 * Math.PI / 180) / Math.pow(2, zoom);
  let scaleText;
  if (metersPerPixel < 1) {
    scaleText = (metersPerPixel * 100).toFixed(1) + ' cm/px';
  } else if (metersPerPixel < 1000) {
    scaleText = metersPerPixel.toFixed(1) + ' m/px';
  } else {
    scaleText = (metersPerPixel / 1000).toFixed(2) + ' km/px';
  }
  document.getElementById('scaleValue').textContent = scaleText;
}

function updateBoundsInfo() {
  const bounds = map.getBounds();
  const sw = bounds.getSouthWest();
  const ne = bounds.getNorthEast();
  const w = (ne.lng - sw.lng).toFixed(5);
  const h = (ne.lat - sw.lat).toFixed(5);
  document.getElementById('boundsInfo').textContent = `约${w}° × ${h}°`;
}

// 初始化
updateScaleInfo();
updateBoundsInfo();
</script>
</body>
</html>
