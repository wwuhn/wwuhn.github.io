        // ===== 状态管理 =====
        let currentSort = { col: null, asc: true };
        let currentKeyword = '';

        // ===== 工具函数 =====
        function formatViews(n) {
            if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
            return n.toLocaleString();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function highlightText(text, keyword) {
            if (!keyword) return escapeHtml(text);
            const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escaped})`, 'gi');
            return escapeHtml(text).replace(regex, '<mark>$1</mark>');
        }

        // ===== 渲染表格 =====
        function renderTable() {
            const tbody = document.getElementById('videoBody');
            const statsText = document.getElementById('statsText');

            // 过滤
            let filtered = videos;
            if (currentKeyword) {
                const kw = currentKeyword.toLowerCase();
                filtered = videos.filter(v => v.title.toLowerCase().includes(kw));
            }

            // 排序
            if (currentSort.col) {
                filtered = [...filtered].sort((a, b) => {
                    let valA, valB;
                    if (currentSort.col === 'title') {
                        valA = a.title; valB = b.title;
                        const cmp = valA.localeCompare(valB, 'zh-CN');
                        return currentSort.asc ? cmp : -cmp;
                    } else if (currentSort.col === 'views') {
                        valA = a.views; valB = b.views;
                        return currentSort.asc ? valA - valB : valB - valA;
                    }
                    return 0;
                });
            }

            // 统计
            const totalViews = filtered.reduce((s, v) => s + v.views, 0);
            if (currentKeyword || currentSort.col) {
                statsText.textContent = `筛选结果：${filtered.length} 个视频 · 总播放 ${formatViews(totalViews)}`;
            } else {
                statsText.textContent = `共 ${videos.length} 个视频 · 总播放 ${formatViews(totalViews)}`;
            }

            // 生成HTML
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;padding:40px;color:#999;font-size:15px;">😕 没有找到匹配的视频</td></tr>`;
                return;
            }

            let html = '';
            filtered.forEach(v => {
                html += `<tr>
                    <td>${v.id}</td>
                    <td><a href="https://www.bilibili.com/video/${v.bv}" target="_blank">${highlightText(v.title, currentKeyword)}</a></td>
                    <td>${formatViews(v.views)}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        // ===== 搜索功能 =====
        const searchInput = document.getElementById('searchInput');
        let searchTimer;
        searchInput.addEventListener('input', function () {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                currentKeyword = this.value.trim();
                renderTable();
            }, 200);
        });

        // ===== 排序功能 =====
        document.querySelectorAll('thead th[data-col]').forEach(th => {
            th.addEventListener('click', function () {
                const col = this.dataset.col;

                // 切换排序方向
                if (currentSort.col === col) {
                    currentSort.asc = !currentSort.asc;
                } else {
                    currentSort.col = col;
                    currentSort.asc = true;
                }

                // 更新表头图标
                document.querySelectorAll('thead th[data-col]').forEach(h => {
                    h.classList.remove('sort-active');
                    h.querySelector('.sort-icon').textContent = '⇅';
                });
                this.classList.add('sort-active');
                this.querySelector('.sort-icon').textContent = currentSort.asc ? '↑' : '↓';

                renderTable();
            });
        });

        // ===== 回到顶部 =====
        const backTopBtn = document.getElementById('backTop');
        window.addEventListener('scroll', () => {
            backTopBtn.classList.toggle('show', window.scrollY > 300);
        });
        backTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ===== 初始渲染 =====
        renderTable();
    </script>
