<!--申请 Key
访问 腾讯位置服务官网 (lbs.qq.com)。
注册并登录账号。
进入控制台，创建一个新的应用，并添加一个“Web开发（JSAPI）”类型的 Key。
修改代码
将你申请到的 Key 填入到 <script> 标签的 src 属性中。
key名称：bzlmap

-->
<!--<script charset="utf-8" src="http://map.qq.com/api/js?v=2.exp"></script>-->
<script charset="utf-8" src="http://map.qq.com/api/js?v=2.exp&key=MCBBZ-332W7-MONXC-HKDFW-2OS4E-KLF5T"></script>
<script>
var searchService,map,markers = [];
//27.912202°N, 111.639950°E
//1000米 ≈ 0.00898° 纬度
//1000米 ≈ 0.01016°经度
var init = function() {
    var center = new qq.maps.LatLng(27.907313,111.646500);
    map = new qq.maps.Map(document.getElementById('container'),{
        center: center,
        zoom: 11,
                // 启用内置比例尺控件
                scaleControl: true,
                scaleControlOptions: {
                    position: qq.maps.ControlPosition.BOTTOM_RIGHT
                }
    });

/*    new qq.maps.Circle({
        center:new qq.maps.LatLng(27.910921,111.646911),
        radius: 300,
        map: map
    });*/
	
		

    var latlngBounds = new qq.maps.LatLngBounds();
    searchService = new qq.maps.SearchService({
        complete : function(results){
            var pois = results.detail.pois;
            for(var i = 0,l = pois.length;i < l; i++){
                var poi = pois[i];
                latlngBounds.extend(poi.latLng);  
                var marker = new qq.maps.Marker({
                    map:map,
                    position: poi.latLng
                });

                marker.setTitle(i+1);
                
                markers.push(marker);
            }
            map.fitBounds(latlngBounds);
        }
    });
            // 关键修复：监听 idle 事件，确保地图加载完成后再创建 Marker
            qq.maps.event.addListenerOnce(map, 'idle', function() {
                var marker = new qq.maps.Marker({
                    position: center,
                    map: map,
                    title: '标记点'
                });
            });	
}

function searchKeyword() {
    var keyword = document.getElementById("keyword").value;
    region = new qq.maps.LatLng(27.910921,111.646911);
   
    searchService.setPageCapacity(5);
    searchService.searchNearBy(keyword, region, 150);
}
</script>
</head>
<body onLoad="init()">
<!--<div>
<input id="keyword" type="textbox" value="酒店">
<input type="button" value="search" onClick="searchKeyword()">
</div>-->
<div style="width:100%;height:600px" id="container"></div>

</body>
